<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="月曆">
<meta name="theme-color" content="#F2F1EE">
<title>月曆</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{--bg:#F2F1EE;--card:#FFFFFF;--line:#E6E4DF;--tx:#262624;--mu:#9B9993;--dim:#B8B8B4;--ac:#262624;--ac2:#C5AECF;--ink:#262624;--hol:#B5584E;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:var(--tx);background:transparent;border:none;outline:none;padding:0;margin:0;-webkit-appearance:none;appearance:none;border-radius:0;box-shadow:none}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 12px calc(env(safe-area-inset-bottom) + 80px);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.mo{font-size:17px;font-weight:600;display:flex;align-items:center;gap:5px}
.mo i{font-size:16px;color:var(--mu)}
.top .r{display:flex;gap:14px;align-items:center}.top .r i{font-size:18px;color:var(--mu)}
.sync{font-size:8.5px;color:var(--dim)}
.strip{display:flex;gap:4px;margin-bottom:14px}
.strip .s{flex:1;text-align:center;padding:7px 0;font-size:9.5px;color:var(--mu);border-radius:10px;background:#FAFAF8}
.strip .s b{display:block;font-size:13px;font-weight:600;color:var(--tx)}
.strip .s.hol b{color:var(--hol)}
.strip .s.td{box-shadow:inset 0 0 0 1px var(--ac)}
.strip .s.on{background:var(--ink)}.strip .s.on,.strip .s.on b{color:var(--bg)}
.strip .s.drop{background:#E6E4DF}
.dh{display:flex;align-items:center;gap:6px;margin:0 2px 8px;min-height:18px}
.dh b{font-size:16px;font-weight:600}.dh .w{font-size:10px;color:var(--mu)}
.tag{font-size:9.5px;border-radius:6px;padding:1px 6px;background:#E6E4DF;color:#6B6964}
.tag.h{background:#F3E2DF;color:var(--hol)}
.dh .mv{margin-left:auto;font-size:10px;color:var(--mu);display:flex;align-items:center;gap:3px}
#list{min-height:55vh;touch-action:pan-y}
.card{display:block;border-radius:12px;padding:0 13px;margin-bottom:8px;background:var(--card);box-shadow:var(--sh);position:relative;user-select:none;-webkit-user-select:none}
.card .row1{display:flex;align-items:center;gap:12px;height:46px}
.card .ck{width:16px;height:16px;border-radius:5px;border:1.4px solid #D2D0CA;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--bg)}
.card.x .ck{background:var(--ac);border-color:var(--ac)}.card.x .tx{text-decoration:line-through;color:var(--dim)}
.card .ckw{padding:10px 4px 10px 0;margin-left:-2px}
.card .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:10px;max-width:42%;overflow:hidden;color:var(--mu);flex-shrink:0;display:flex;gap:4px;align-items:center}
.card .mt i{font-size:11px}.card .mt .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .det{border-top:1px solid #EFEDE9;padding:8px 0 11px 28px;font-size:11px;color:#5E5C57}
.card .det div{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px;line-height:1.5}
.card .det i{font-size:13px;color:var(--mu);margin-top:1px}
.card .det .none{color:var(--dim)}
.card .eb{margin-top:6px;font-size:11px;font-weight:600;color:var(--tx);padding:5px 12px;border-radius:8px;background:#F2F1EE;display:inline-flex;gap:4px;align-items:center}
.card .bar{width:4px;height:20px;border-radius:2px;flex-shrink:0;opacity:.55}
.card.dragging{opacity:.95;box-shadow:0 8px 20px rgba(60,50,40,.18);z-index:5}
.card.ph{opacity:.25}
.card.new{background:var(--card);border:1px solid #D2D0CA;box-shadow:none;display:flex;align-items:center;gap:12px;height:46px}
.card.new input{flex:1;min-width:0;height:22px;font-size:12px;caret-color:var(--ac)}
.tools{display:flex;gap:16px;margin:4px 4px 10px;font-size:16px;color:var(--mu);align-items:center}
.tools .on{color:var(--ac)}
.tools .sp{flex:1}
.tools .cx,.tools .ok{font-size:12px}.tools .ok{color:var(--ac);font-weight:600}
.tools .del{color:#C98}
.pane{margin:0 4px 10px}
.line{display:flex;align-items:center;gap:8px}
.line i{font-size:11px;color:var(--ac);width:12px}
.line input{flex:1;font-size:12px;line-height:22px;border-bottom:1px solid #D6D0C7;caret-color:var(--ac)}
.line input:focus{border-bottom-color:var(--ac)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw span{width:20px;height:20px;border-radius:5px;opacity:.75}
.sw span.on{outline:1.2px solid var(--ac);outline-offset:2px}
.sw .none{border:1px solid #D2D0CA;background:#fff;opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:11px;padding:5px 12px;border-radius:8px;background:var(--card);color:var(--mu)}
.chips span.on{background:var(--ink);color:var(--bg)}
.wheel{position:relative;display:flex;justify-content:center;gap:18px;height:90px;overflow:hidden}
.wheel .hl{position:absolute;left:25%;right:25%;top:36px;height:18px;border-top:1px solid #E0DAD1;border-bottom:1px solid #E0DAD1;pointer-events:none}
.wheel .col{height:90px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;width:42px;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel .col::-webkit-scrollbar{display:none}
.wheel .col div{height:18px;line-height:18px;scroll-snap-align:center;font-size:12.5px;color:var(--mu)}
.wheel .col div.sel{color:var(--tx);font-size:12px}
.wheel .colon{line-height:90px;color:var(--mu)}
.wf{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px}.wf .set{color:var(--ac)}.wf button{color:var(--mu)}
.empty{color:var(--dim);text-align:center;padding:32px 0;font-size:12px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(60,50,40,.25);z-index:10}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:12px;display:flex;gap:16px;align-items:center;z-index:30;box-shadow:0 4px 14px rgba(60,50,40,.25);max-width:90vw}
.toast button{color:var(--ac2);font-weight:500}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;padding:calc(env(safe-area-inset-top) + 28px) 14px 20px;overflow-y:auto}
.ov .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ov .h b{font-weight:600;font-size:15px}.ov .h i{font-size:16px;color:var(--ac);padding:4px 8px}
.wk,.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:10px;color:var(--mu);padding-bottom:6px}
.mg div{padding:10px 0 6px;font-size:13px;border-radius:10px}
.mg div.on{background:var(--ink);color:var(--bg)}
.mg div.td{box-shadow:inset 0 0 0 1px var(--ac)}
.mg div.hol{color:var(--hol)}
.mg div.sel{background:#E6E4DF}
.mg .d{display:block;width:4px;height:4px;border-radius:2px;background:#9B9993;margin:2px auto 0;opacity:.8}
.mg div.on .d{background:var(--bg)}
.ov .note{margin-top:16px;text-align:center;font-size:11px;color:var(--mu)}
.ov .btn{display:block;margin:16px auto 0;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 18px;font-weight:500}
.sr{display:flex;align-items:center;gap:8px;border-bottom:1px solid #D6D0C7;padding-bottom:4px;margin-bottom:12px}
.sr i{color:var(--ac);font-size:16px}.sr input{flex:1;font-size:14px}
.res{display:flex;gap:10px;padding:10px 11px;margin-bottom:7px;background:var(--card);border-radius:10px}
.res .dt{color:var(--mu);font-size:11px;width:54px;flex-shrink:0}
.res.x .t{text-decoration:line-through;color:var(--dim)}
/* 橫拿：整週 */
#week{display:none}
@media (orientation:landscape) and (min-width:560px){
  #app{max-width:none;padding-bottom:20px}
  #day,.fab{display:none!important}
  #week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wc{background:var(--card);border-radius:10px;padding:7px;min-height:70vh}
  .wc .h{font-size:9px;color:var(--mu);margin-bottom:5px;display:flex;justify-content:space-between}
  .wc .h b{color:var(--tx);font-size:11px;font-weight:500}
  .wc.td{box-shadow:inset 0 0 0 1.5px var(--ac)}
  .wc.hol .h b{color:var(--hol)}
  .wc .p{font-size:9.5px;border-radius:6px;padding:3px 6px;margin-bottom:4px;background:#F2F1EE;line-height:1.35;word-break:break-all}
  .wc .p.x{text-decoration:line-through;opacity:.45}
  .wc .hn{font-size:8px;color:var(--hol);margin-bottom:4px}
}

/* 放大觸控範圍（手機好按） */
html,body{font-size:14px}
.mo{font-size:19px}.top .r{gap:20px}.top .r i{font-size:22px}.top .r button,.mo{padding:6px 0}
.strip .s{padding:9px 0;font-size:10.5px}.strip .s b{font-size:15px}
.dh b{font-size:18px}.dh .w,.dh .mv{font-size:11.5px}.tag{font-size:10.5px;padding:2px 7px}
.card .row1{height:56px;gap:14px}.card .ck{width:20px;height:20px;border-radius:6px;font-size:11px}
.card .ckw{padding:16px 10px 16px 2px;margin-left:-4px}
.card .mt{font-size:11.5px}.card .mt i{font-size:13px}.card .bar{height:24px;width:5px}
.card .det{font-size:13px;padding-left:34px}.card .eb{font-size:13px;padding:8px 16px}
.card.new{height:56px}.card.new input{font-size:14px;height:26px}
.tools{gap:6px;font-size:20px}.tools button{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.tools .cx,.tools .ok{font-size:14px;min-width:48px}
.line input{font-size:14px;line-height:30px}.sw span{width:28px;height:28px;border-radius:8px}.sw{gap:12px}
.chips span{font-size:13px;padding:8px 16px}
.wheel{height:150px}.wheel .col{height:150px;width:60px}.wheel .col div{height:30px;line-height:30px;font-size:16px}.wheel .colon{line-height:150px}.wheel .hl{top:60px;height:30px}
.wf{font-size:14px}.wf button{padding:8px 0}
.fab{width:58px;height:58px;font-size:26px;border-radius:16px}
.toast{font-size:14px;padding:12px 18px}
.mg div{padding:13px 0 8px;font-size:15px}.wk span{font-size:11.5px}.ov .h b{font-size:17px}.ov .h i{font-size:22px}
.res{padding:14px}.res .dt{font-size:12.5px;width:60px}.sr input{font-size:16px}
.empty{font-size:14px}

/* 編輯頁 */
.ov.ed{padding-top:calc(env(safe-area-inset-top) + 22px)}
.eh{display:flex;justify-content:space-between;align-items:center;height:52px;margin-bottom:6px}
.eh b{font-size:16px;font-weight:600}
.eh button{font-size:16px;color:var(--mu);padding:10px 4px;min-width:56px;text-align:left}
.eh .ok{color:var(--tx);font-weight:600;text-align:right}
.grp{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden}
.grp .big{width:100%;font-size:18px;padding:16px;line-height:1.4}
.rw{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-bottom:1px solid #EFEDE9;width:100%;text-align:left;font-size:15px}
.rw:last-child{border-bottom:none}
.rw.top{align-items:flex-start;padding-top:16px;padding-bottom:12px}
.rw>i{font-size:20px;color:var(--mu);flex-shrink:0}
.rw .k{width:44px;flex-shrink:0;color:var(--mu);font-size:14px}
.rw input,.rw textarea{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--tx);background:transparent;border:none;outline:none;resize:none;padding:0;line-height:1.5}
.rw .v{flex:1;font-size:15px}.rw .v.ph{color:var(--dim)}
.rw .ch{font-size:18px;color:var(--dim)}
.rw .x{width:30px;height:30px;border-radius:15px;background:#EFEDE9;color:var(--mu);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.rw .sw{flex:1;gap:12px}.rw .sw span{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.rw .sw .none{color:var(--dim);font-size:16px}
.rw .chips{flex:1;gap:6px;flex-wrap:nowrap}.rw .chips span{background:#F2F1EE;font-size:12.5px;padding:8px 10px;white-space:nowrap}.rw .chips span.on{background:var(--ink);color:#fff}
.rw.act{font-size:15px;color:var(--tx);gap:12px}.rw.act i{font-size:20px;color:var(--mu)}
.rw.del,.rw.del i{color:var(--hol)}
.ed .pane{padding:4px 14px 12px;border-bottom:1px solid #EFEDE9}

/* 動態與觸控 */
#app{overflow-x:hidden;overflow-x:clip}
button,.strip .s,.chips span,.sw span,.mg div,.res{transition:transform .12s ease,opacity .12s}
button:active,.strip .s:active,.chips span:active,.sw span:active,.mg div:active,.res:active{transform:scale(.93);opacity:.7}
.rw:active{opacity:.6}
.fab{transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.9);opacity:1}
.cw{position:relative;margin-bottom:8px;border-radius:12px;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.cw .card{margin:0;z-index:1;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
.cw.press .card{transform:scale(.975);background:#FAFAF8}
.sa{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;padding:0 26px;font-size:22px;color:#fff;opacity:0;transition:opacity .15s}
.sa.l{background:#6E7F5C;justify-content:flex-start}
.sa.r{background:var(--hol);justify-content:flex-end}
.cw.dragging{z-index:5;transition:none}
.cw.dragging .card{transform:scale(1.03);box-shadow:0 14px 30px rgba(60,50,40,.22)}
.card.x .tx{text-decoration:none}
.card .tx span{background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0 1.3px}
.card.x .tx span{background-size:100% 1.3px}
.card.pop.x .tx span{animation:strike .32s ease-out}
.card.pop:not(.x) .tx span{animation:unstrike .22s ease-in}
.card.pop .ck{animation:ckpop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes strike{from{background-size:0 1.3px}}
@keyframes unstrike{from{background-size:100% 1.3px}}
@keyframes ckpop{0%{transform:scale(.55)}100%{transform:scale(1)}}
.card .det{overflow:hidden}
.ov.ed.in{animation:edup .36s cubic-bezier(.2,.85,.25,1)}
@keyframes edup{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:#D6D3CD;margin:0 auto 2px}
.toast{animation:tin .26s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
.card.tn .ck{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.16)}
.card.tn .mt{color:rgba(38,38,36,.5)}
.card .ck i{font-size:14px;-webkit-text-stroke:.6px currentColor}
.card.x.tn .ck{background:var(--ac);border-color:var(--ac)}
.inc{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:18px}
.inc div{background:var(--card);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--mu)}
.inc b{display:block;font-size:24px;font-weight:600;color:var(--tx);margin-top:2px}
.inc div.hi{background:#EBE2F1}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}.mh b{font-size:15px;font-weight:600}.mh span{font-size:11px;color:var(--mu)}
.mb{background:var(--card);border-radius:12px;padding:8px 14px}
.mr{display:grid;grid-template-columns:38px 1fr;gap:4px 10px;align-items:center;padding:7px 0;font-size:13px}
.mr .tk{height:10px;border-radius:5px;background:#F2F1EE;overflow:hidden;position:relative}
.mr .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.mr .v{grid-column:2;font-size:12px;color:var(--mu);margin-top:-2px}.mr .v b{color:var(--tx);font-weight:600}
.mr.now .m{font-weight:600}
.pend-top{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}.pend-h{display:flex;align-items:center;gap:8px;flex:1;min-width:0;margin:0;font-size:13px;color:var(--mu)}.pend-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pend-h0{flex:1;font-size:13px;color:var(--mu)}
.pend-add{flex-shrink:0;font-size:13px;color:var(--tx);background:#fff;border-radius:99px;padding:6px 12px;box-shadow:inset 0 0 0 1px #E6E4DF}.pend-add:active{transform:scale(.96)}
.pend-h b{background:var(--ink);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:600}
.pend-h i{margin-left:auto;font-size:16px;transition:transform .2s}.pend-h.cl i{transform:rotate(-90deg)}
.pi{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;margin-bottom:8px;border-radius:12px;background:#FAFAF8;border:1px solid #E6E4DF;user-select:none;-webkit-user-select:none;transition:transform .15s,opacity .15s}
.pi:active{transform:scale(.98)}
.pi .pt{flex:1;min-width:0}.pi .pt small{display:block;font-size:11px;color:var(--mu)}.pi .pt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.pi .du{font-size:11px;color:var(--mu);flex-shrink:0;text-align:right}.pi .du.soon{color:var(--hol);font-weight:600}
.pi .gr{color:var(--dim);font-size:18px}
.pghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 14px 30px rgba(60,50,40,.22);transform:scale(1.03);background:#fff;opacity:.97}
.sheet{position:fixed;inset:0;z-index:35;background:rgba(38,38,36,.28);display:flex;align-items:flex-end;animation:fdin .2s}
.sheet .bx{width:100%;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);animation:edup .3s cubic-bezier(.2,.85,.25,1)}
.sheet .tt{font-size:12px;color:var(--mu);padding:2px 4px 10px}.sheet .tt b{display:block;font-size:15px;color:var(--tx);font-weight:600;margin-top:2px}
.sheet button{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;background:#fff;border-radius:12px;margin-bottom:8px;font-size:15px}
.sheet button i{font-size:19px;color:var(--mu)}.sheet button.cx{justify-content:center;background:none;color:var(--mu)}
@keyframes fdin{from{opacity:0}}
#day.hasp #list{min-height:0}
.sa{pointer-events:none}.sa.on{pointer-events:auto;z-index:0}
#backZone{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:64px;z-index:30;border-radius:16px;border:1.5px solid #C9C6BF;background:rgba(250,250,248,.95);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--mu);animation:tin .2s;transition:background .15s,color .15s,transform .15s}
#backZone i{font-size:20px}
#backZone.hot{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.03)}
.rw .sw{gap:9px;flex-wrap:nowrap}.rw .sw span{width:29px;height:29px;flex-shrink:0}
.tag.sp{flex-shrink:0;background:rgba(38,38,36,.08);color:#6B6964}
.cw.spn .ck{opacity:.35}
.cw.lift .card{transform:scale(1.03);box-shadow:0 10px 24px rgba(60,50,40,.18)}
.sheet button i{font-size:19px;color:var(--mu)}

<body>
<div id="app">
  <div class="top"><button class="mo" id="moBtn"><span id="moTxt"></span></button><div class="r"><span class="sync" id="sync"></span><button id="tdBtn" aria-label="月曆"><i class="ti ti-calendar-month"></i></button><button id="inBtn" aria-label="收入"><i class="ti ti-coin"></i></button><button id="srBtn"><i class="ti ti-search"></i></button></div></div>
  <div class="strip" id="strip"></div>

  <div id="day"><div class="dh" id="dh"></div><div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div><div id="pend"></div></div>

<div id="toast"></div>
<script>
// 試算表裡的顏色一律換成 4 種低彩度色調顯示；App 裡選色時寫回對應的淡色
const TONES=[['#B5665E','#F6DCD9'],['#A27A62','#F5E6DC'],['#768462','#E6EEDB'],['#5F7F89','#DDE9ED'],['#86739A','#EBE2F1']]; // [色票, 卡片底色＝寫回試算表的顏色]：紅、橘棕、綠、藍、紫
function tone(hex){if(!hex||!/^#[0-9a-f]{6}$/i.test(hex))return '';const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dl=mx-mn;if(dl<0.035||(l>0.975))return '';const sat=dl/(1-Math.abs(2*l-1));if(sat<0.12)return '';let h=mx===r?((g-b)/dl)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4;h=(h*60+360)%360;const i=(h>=345||h<18)?0:h<70?1:h<170?2:h<245?3:4;return TONES[i][0]}
const fillOf=hex=>{const t=tone(hex);const c=TONES.find(x=>x[0]===t);return c?c[1]:''};
const WD='日一二三四五六';
const M={};               // 已載入的月份資料
const T=new Date();
let cur={y:T.getFullYear(),m:T.getMonth()+1,d:T.getDate()};
let edit=null;            // 正在編輯的待辦
let openIdx=-1;           // 展開看詳細的卡片
let pending=0;
// ---- 背景更新不打斷操作：同步回來時若正在點、選單開著，就等放開後再重畫 ----
let TOUCH=false,NEEDR=false,touchedSinceVisible=false;
function busyUI(){return TOUCH||!!edit||!!D||(typeof DDRAG!=='undefined'&&(!!DDRAG||!!DADD||!!DINL||(typeof CS!=='undefined'&&CS.busy())))||!!document.querySelector('.sheet,.yr,#ovl .ov')}
function bgRender(){if(busyUI()){NEEDR=true;return}NEEDR=false;render()}
function flushRender(){if(NEEDR&&!busyUI()){NEEDR=false;render()}}
document.addEventListener('touchstart',()=>{TOUCH=true;touchedSinceVisible=true},{capture:true,passive:true});
const touchEnd=()=>{TOUCH=false;setTimeout(flushRender,400)};  // 等點擊事件先跑完
document.addEventListener('touchend',touchEnd,{capture:true,passive:true});
document.addEventListener('touchcancel',touchEnd,{capture:true,passive:true});
document.addEventListener('mousedown',()=>{touchedSinceVisible=true},true);
setInterval(flushRender,1500);  // 關掉選單、編輯頁之後補畫
let LP=false,PEND=[],OPEN=[],POPEN=true,PDRAG=false;try{POPEN=localStorage.getItem('pendOpen')!=='0'}catch(e){}
let POP=-1,JO=-1,ED_IN=false,SW=null,SLIDING=false;  // 動畫狀態：剛打勾、剛展開、編輯頁剛打開、左滑露出刪除、換天中
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// iPhone 網頁沒有震動 API；iOS 18 起點一下「開關」核取方塊會有輕微觸感
let HP=null;
function haptic(){try{if(navigator.vibrate){navigator.vibrate(12);return}if(!HP){HP=document.createElement('label');HP.style.display='none';HP.innerHTML='<input type="checkbox" switch>';document.body.appendChild(HP)}HP.click()}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=(y,m)=>y+'-'+m;
const keyOf=o=>o.y+'-'+o.m+'-'+o.d;
const addDays=(o,n)=>{const t=new Date(o.y,o.m-1,o.d+n);return {y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}};
const isToday=o=>o.y===T.getFullYear()&&o.m===T.getMonth()+1&&o.d===T.getDate();
const same=(a,b)=>a.y===b.y&&a.m===b.m&&a.d===b.d;
const dayItems=o=>{const mm=M[ym(o.y,o.m)];return mm&&mm.days[o.d]?mm.days[o.d]:[]};
const setItems=(o,list)=>{const k=ym(o.y,o.m);if(!M[k])M[k]={y:o.y,m:o.m,exists:true,days:{},holidays:{}};M[k].days[o.d]=list};
const holiday=o=>{const mm=M[ym(o.y,o.m)];return mm&&mm.holidays?mm.holidays[o.d]:''};
const sig=l=>l.filter(i=>!i.virtual).map(i=>String(i.text).trim()+'|'+(i.done?1:0));
const clone=x=>JSON.parse(JSON.stringify(x));
// ---- 分類：剪片（黑）／標記（霧藍）／Zhao's（白框）；手動標紅＝急事。同一天裡同類排在一起 ----
const CATN=['剪片','標記',"Zhao's"];
const MARK_RE=/交片|交檔|回覆|回饋|線上對|請款|改點|提醒|勞報|詢問/i,WORK_RE=/剪輯|順剪|成片|輸出|破口|封面|逐字|修改|剪/,CASE_RE=/｜|【|feat\.|\sx\s|醫師|[A-Za-z]{1,5}\s?\.?\s?\d{1,4}/i;
function baseCat(t){t=String(t);if(MARK_RE.test(t))return 1;if(WORK_RE.test(t)||CASE_RE.test(t))return 0;return 2}
// 記住手動改過的分類：同樣名稱的事項之後自動分對（從備註「分類：」學，所以手機和電腦會一起學到）
const LKEY=t=>String(t).trim().replace(/\s+/g,' ').toLowerCase();
let LEARN={},LNOTE={};try{LEARN=JSON.parse(localStorage.getItem('catlearn')||'{}')||{}}catch(e){}
function learnScan(){const m={};Object.values(M).forEach(mm=>Object.values((mm&&mm.days)||{}).forEach(l=>l.forEach(it=>{if(it.span||it.virtual)return;const c=String(it.note||'').match(/^分類[:：]\s*(.+)$/m);const i=c?CATN.indexOf(c[1].trim()):-1;if(i>=0)m[LKEY(it.text)]=i})));LNOTE=m}
function autoCat(t){const k=LKEY(t);if(k in LEARN)return LEARN[k];if(k in LNOTE)return LNOTE[k];return baseCat(t)}
function catOf(it){if(!it)return 2;if(it.virtual||String(it.text).trim()==='運動')return 3;const i=CATN.indexOf(parseNote(it.note).cat);return i>=0?i:autoCat(it.text)}
const RED='#F6DCD9';
const isRed=it=>!!it&&tone(it.bg)===TONES[0][0];
const kCls=it=>isRed(it)?'kr':'k'+catOf(it);
function sortCat(items){return items.map((x,i)=>({x,i,c:catOf(x)})).sort((a,b)=>a.c-b.c||a.i-b.i).map(o=>o.x)}
function normM(mm){if(mm&&mm.days)Object.keys(mm.days).forEach(d=>{mm.days[d]=sortCat(mm.days[d])});return mm}
// ---- 顯示用的短名稱（表格裡的完整名稱不動；滑鼠指上去看全名） ----
const STAGE_TAIL=/(?:AC|BC)?\s?(?:剪輯完成|破口剪輯|修改輸出|輸出上傳|剪輯|順剪|修改|輸出|交片|交檔|破口|封面|給逐字|逐字|上傳|回饋|回覆|final|線上對)(?:[+＋][^\s]+)*(?:\s?[*×]\s?\d+)?$/i;
function shortName(t){t=String(t);let m;
  if(/^業配｜/.test(t))return t.replace(/^業配｜\s*/,'');
  if(/^(無雙電波|EMFUSION)｜/i.test(t))return t.replace(/^(無雙電波|EMFUSION)｜\s*/i,'');
  const tail=()=>{const x=t.match(STAGE_TAIL);return x?' '+x[0].trim():''};
  if(/^Podcast/i.test(t)&&(m=t.match(/^(.*?EP\.?\s?\d+)/i)))return m[1]+tail();
  if(m=t.match(/^(\S*醫師)｜\s*([A-Za-z]{1,5}\s?\.?\s?\d{1,4})/))return m[1]+'｜'+m[2]+tail();
  return t}
function setCat(o,i,c){const items=clone(dayItems(o)),n=parseNote(items[i].note);LEARN[LKEY(items[i].text)]=c;try{localStorage.setItem('catlearn',JSON.stringify(LEARN))}catch(e){}n.cat=c===baseCat(items[i].text)?'':CATN[c];items[i].note=makeNote(n);save([{o,items}]);toast('已改成「'+CATN[c]+'」')}

// 後端 API（Google Apps Script）。金鑰只存在這支手機/電腦，不在程式碼裡
const API='https://script.google.com/macros/s/AKfycbxkTq8peIBj3mjRBetSUJw4mDtBmyNt0WGsFx7RBk9J2EdvEAF89xSWXao5TWIdniwPmA/exec';
function getKey(){
  const h=location.hash.match(/k=([0-9a-f]+)/);
  if(h){try{localStorage.setItem('calkey',h[1]);history.replaceState(null,'',location.pathname+location.search)}catch(e){}return h[1]}
  try{return localStorage.getItem('calkey')||''}catch(e){return ''}
}
let KEY=getKey();
addEventListener('hashchange',()=>{if(getKey()){KEY=getKey();location.reload()}});
function askKey(){const k=prompt('請貼上月曆金鑰');if(k){KEY=k.trim();try{localStorage.setItem('calkey',KEY)}catch(e){}}return KEY}
async function call(action,payload){
  if(!KEY)KEY=getKey();
  if(!KEY&&!askKey())throw new Error('沒有金鑰');
  const w=['save','append','repeat','pendSkip','pendUnskip','spanOp','periodSet','caseUpdate','caseAdd','caseDelete','caseRestore','clientSave','fxRenew','fxSet','pendAdd'].includes(action);  // 只有寫入才顯示右上角「同步中…」
  if(w){pending++;syncTxt()}
  try{
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),60000);let res;
    try{res=await fetch(API,{method:'POST',body:JSON.stringify({t:KEY,action,payload:payload||{}}),signal:ac.signal})}catch(e){throw new Error(e.name==='AbortError'?'連線逾時':'Failed to fetch')}finally{clearTimeout(tm)}
    const r=await res.json();
    if(r.auth===false){try{localStorage.removeItem('calkey')}catch(e){}KEY='';throw new Error('金鑰錯誤，請重新整理後再貼一次')}
    if(r.ok||r.conflict)return r;
    throw new Error(r.error);
  }finally{if(w){pending--;syncTxt()}}
}
let SYNCERR='';
function syncTxt(){const n=typeof qN==='function'?qN():0,t=pending?'儲存中…':n?`未同步 ${n} 筆・點我重送`:SYNCERR?`⚠ 讀取失敗（${SYNCERR}）・點我重試`:'';[$('#sync'),$('#dkSync')].forEach(el=>{if(!el)return;el.textContent=t;el.classList.toggle('qwait',!pending&&(n>0||!!SYNCERR));el.onclick=n?()=>flushQ(true):SYNCERR?()=>syncNow():null})}
function absorb(r){if(r&&r.months){Object.keys(r.months).forEach(k=>{M[k]=normM(r.months[k]);delete STALE[k]});applyQ();persist()}}
const INF={};
// 手機裡存一份最近幾個月，打開先顯示，再背景同步（STALE＝還沒跟試算表確認過）
const STALE={};
function persist(){try{const keep={};const n=T.getFullYear()*12+T.getMonth();Object.keys(M).forEach(k=>{const [y,m]=k.split('-').map(Number);if(Math.abs(y*12+m-1-n)<=1)keep[k]=M[k]});localStorage.setItem('calcache',JSON.stringify(keep))}catch(e){}}
// ---- 離線補送：網路斷掉、逾時或試算表忙碌時，改動先存在這台裝置（畫面照樣更新），連回來自動補送 ----
let Q={};try{Q=JSON.parse(localStorage.getItem('calq')||'{}')||{}}catch(e){Q={}}
let QSEQ=0,QRUN=null,QAG=false,QT=null,QWAIT=8000,QWARN=false;
const qPut=()=>{try{localStorage.setItem('calq',JSON.stringify(Q))}catch(e){}};
const qN=()=>Object.keys(Q).length;
const qRetry=e=>/Failed to fetch|逾時|忙碌|network|load failed|JSON|Unexpected/i.test((e&&e.message)||'');
function applyQ(){Object.keys(Q).forEach(k=>{const [y,m,d]=k.split('-').map(Number);setItems({y,m,d},clone(Q[k].items))})}
function qLater(){clearTimeout(QT);QT=setTimeout(()=>flushQ(),QWAIT);QWAIT=Math.min(QWAIT*2,60000)}
function flushQ(manual){if(QRUN){QAG=true;return QRUN}if(!qN())return Promise.resolve();clearTimeout(QT);if(manual)QWAIT=8000;
  QRUN=(async()=>{do{QAG=false;const keys=Object.keys(Q);if(!keys.length)break;
      const sent=keys.map(k=>({k,seq:Q[k].seq,sg:sig(Q[k].items)}));
      try{const r=await call('save',{changes:keys.map(k=>({key:k,base:Q[k].base,items:Q[k].items,vx:true}))});
        if(r.conflict){sent.forEach(x=>delete Q[x.k]);qPut();absorb(r);toast('試算表在別處被改過，已重新整理');render();break}
        sent.forEach(x=>{const q=Q[x.k];if(!q)return;if(q.seq===x.seq)delete Q[x.k];else{q.base=x.sg;q.orig=null}});qPut();
        absorb(r);bgRender();QWAIT=8000;if(r.merged)toast('另一台裝置也改過，已把兩邊的改動合併');if(QWARN){QWARN=false;toast('連上了，離線時的改動都補存好了 ✓')}}
      catch(e){
        if(qRetry(e)){if(!QWARN){QWARN=true;toast('網路不穩，改動先存在這台裝置，連上後會自動補送')}qLater();break}
        if(/金鑰/.test(e.message||'')){toast(e.message);break}
        sent.forEach(x=>{const q=Q[x.k];if(q&&q.orig){const [y,m,d]=x.k.split('-').map(Number);setItems({y,m,d},q.orig)}delete Q[x.k]});qPut();render();toast('沒存成功：'+(e.message||e));break}
    }while(QAG&&qN())})().finally(()=>{QRUN=null;syncTxt();if(QAG&&qN()&&!QT)flushQ()});
  return QRUN}
addEventListener('online',()=>flushQ(true));
try{const c=JSON.parse(localStorage.getItem('calcache')||'{}');Object.keys(c).forEach(k=>{M[k]=normM(c[k]);STALE[k]=1})}catch(e){}
applyQ();
async function loadMonth(y,m,force){const k=ym(y,m);if(M[k]&&!force&&!STALE[k])return M[k];if(INF[k])return INF[k];INF[k]=call('month',{y,m}).then(r=>{M[k]=normM(r.month);delete STALE[k];applyQ();persist();return M[k]}).finally(()=>delete INF[k]);return INF[k]}

// ---- 備註（時間/地點/備註）存在試算表附註 ----
function parseNote(n){const o={tm:'',pl:'',nt:'',per:'',fire:false,nofire:false},rest=[];String(n||'').split('\n').forEach(l=>{let t;if(t=l.match(/^時間[:：]\s*(.*)$/))o.tm=t[1];else if(t=l.match(/^地點[:：]\s*(.*)$/))o.pl=t[1];else if(t=l.match(/^期間[:：]\s*(.*)$/))o.per=t[1].trim();else if(/^截止[:：]\s*不顯示/.test(l))o.nofire=true;else if(/^截止[:：]/.test(l))o.fire=true;else if(t=l.match(/^分類[:：]\s*(.*)$/))o.cat=t[1].trim();else if(t=l.match(/^備註[:：]\s*(.*)$/))rest.push(t[1]);else if(l.trim())rest.push(l)});o.nt=rest.join(' ');return o}
function makeNote(o){return [o.tm?'時間：'+o.tm:'',o.pl?'地點：'+o.pl:'',o.nt?'備註：'+o.nt:'',o.per?'期間：'+o.per:'',o.fire?'截止：當天':o.nofire?'截止：不顯示':'',o.cat?'分類：'+o.cat:''].filter(Boolean).join('\n')}
// 「期間：12/2–12/6」→ 每一天（年份用目前看的日子推算，可跨年）
function perDays(per,ref){const m=String(per||'').match(/^(\d{1,2})\/(\d{1,2})\s*[–\-~～]\s*(\d{1,2})\/(\d{1,2})$/);if(!m)return [];
  let s=new Date(ref.y,+m[1]-1,+m[2]);if(s>new Date(ref.y,ref.m-1,ref.d))s=new Date(ref.y-1,+m[1]-1,+m[2]);
  let e=new Date(s.getFullYear(),+m[3]-1,+m[4]);if(e<s)e=new Date(s.getFullYear()+1,+m[3]-1,+m[4]);
  const out=[];for(let t=new Date(s);t<=e&&out.length<400;t.setDate(t.getDate()+1))out.push({y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()});return out}
const perOf=it=>parseNote(it&&it.note).per;
// 底部選單，回傳選到的 key
function choose(title,opts,preview){return new Promise(res=>{const box=document.createElement('div');box.className='sheet'+(preview?' blur':'');
  box.innerHTML=`${preview?`<div class="pvw">${preview}</div>`:''}<div class="bx"><div class="tt"><b>${esc(title)}</b></div>${opts.map(o=>`<button data-k="${o[0]}">${o[1]}</button>`).join('')}<button class="cx" data-k="">取消</button></div>`;
  document.body.appendChild(box);box.onclick=e=>{if(e.target===box){box.remove();res('')}};
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.dataset.k)haptic();box.remove();res(b.dataset.k)})})}
// 對整串（同名稱＋同期間）的每一天做同一件事：fn(items,idx) 回傳新的 items
async function eachInSeries(text,per,fn){const days=perDays(per,cur);await Promise.all([...new Set(days.map(o=>ym(o.y,o.m)))].map(k=>{const [y,m]=k.split('-').map(Number);return loadMonth(y,m).catch(()=>{})}));
  const ch=[];days.forEach(o=>{const items=clone(dayItems(o));const i=items.findIndex(x=>!x.span&&String(x.text).trim()===String(text).trim()&&perOf(x)===per);if(i>=0)ch.push({o,items:fn(items,i)})});
  if(ch.length)await save(ch);return ch.length}

async function spanMenu(o,i,pre){const it=dayItems(o)[i];if(!it||!it.span)return;
  const k=pre||await choose(shortName(it.text),[['t',it.done?'取消完成':'劃線完成'],['e','編輯（改名稱、日期、備註）'],['d','刪除整段']]);if(!k)return;

// ---- 經期（A：日期旁小水滴；半透明＝預測）。資料在試算表隱藏分頁「經期」，不是月曆卡片 ----
let PER=[];try{PER=JSON.parse(localStorage.getItem('percache')||'[]')||[]}catch(e){PER=[]}
const pad2=n=>String(n).padStart(2,'0'),pKey=o=>o.y+'-'+pad2(o.m)+'-'+pad2(o.d);
const pDt=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)},DAY=864e5;
let PERC=null;
function perCalc(){const today=new Date(T.getFullYear(),T.getMonth(),T.getDate());
  const act=PER.map(([s,e])=>{const S=pDt(s);let E=e?pDt(e):new Date(Math.min(+S+6*DAY,Math.max(+today,+S)));return [S,E]}).sort((a,b)=>a[0]-b[0]);
  const pred=[];if(act.length){const st=act.map(r=>r[0]);let cyc=[];for(let i=1;i<st.length;i++){const g=Math.round((st[i]-st[i-1])/DAY);if(g>=15&&g<=60)cyc.push(g)}
    cyc=cyc.slice(-6);const C=cyc.length?Math.round(cyc.reduce((a,b)=>a+b,0)/cyc.length):28;
    const lens=PER.filter(r=>r[1]).map(r=>Math.round((pDt(r[1])-pDt(r[0]))/DAY)+1).filter(n=>n>0&&n<15).slice(-6);const L=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):5;
    const last=act[act.length-1];for(let k=1;k<=3;k++){const S=new Date(+last[0]+k*C*DAY);pred.push([S,new Date(+S+(L-1)*DAY)])}}
  PERC={act,pred}}
function menOf(o){if(!PERC)perCalc();const t=+new Date(o.y,o.m-1,o.d);for(const r of PERC.act)if(t>=+r[0]&&t<=+r[1])return {k:'a',n:Math.round((t-r[0])/DAY)+1};for(const r of PERC.pred)if(t>=+r[0]&&t<=+r[1])return {k:'p',n:Math.round((t-r[0])/DAY)+1};return null}
const DROPI=(k,t)=>`<svg class="pdrop ${k==='p'?'pr':''}" viewBox="0 0 10 12" aria-label="${t}"><title>${t}</title><path d="M5 .6S1 5.2 1 7.7a4 4 0 0 0 8 0C9 5.2 5 .6 5 .6z"/></svg>`;
const perIcon=o=>{const p=menOf(o);return p?DROPI(p.k,p.k==='a'?`經期第 ${p.n} 天`:'預測經期'):''};
function perSet(op,o){call('periodSet',{op,date:pKey(o)}).then(r=>{PER=r.periods||[];try{localStorage.setItem('percache',JSON.stringify(PER))}catch(e){}PERC=null;render();toast(op==='start'?`已記錄 ${o.m}/${o.d} 經期開始`:op==='end'?`已記錄 ${o.m}/${o.d} 經期結束`:'已刪除這次記錄')}).catch(e=>toast('沒存成功：'+(e.message||e)))}
async function perMenu(o){const p=menOf(o),t=+new Date(o.y,o.m-1,o.d);if(!PERC)perCalc();
  const near=PER.some(([s])=>{const S=+pDt(s);return S<=t&&t-S<=13*DAY});const opts=[];
  if(!p||p.k!=='a'||p.n>1)opts.push(['start','<i class="ti ti-droplet"></i>經期開始（這天）']);
  if(near)opts.push(['end','<i class="ti ti-droplet-off"></i>經期結束（這天）']);
  if(p&&p.k==='a')opts.push(['clear','<i class="ti ti-trash"></i>刪除這次經期記錄']);
  const k=await choose(`${o.m}/${o.d}${p?(p.k==='a'?`・經期第 ${p.n} 天`:'・預測經期'):''}`,opts);if(k)perSet(k,o)}

// ---- 存檔（先更新畫面，再寫回試算表） ----
// 「運動」永遠排在最下面（伺服器也會這樣排）
const pinLast=items=>items.filter(x=>x.span||String(x.text).trim()!==EX).concat(items.filter(x=>!x.span&&String(x.text).trim()===EX));
async function save(list){ // list:[{o,items}]
  list=list.map(x=>({o:x.o,items:sortCat(x.items)}));
  // 每一天的改動先放進待送清單（同一天連續改只送最後結果），再送出；送不出去就留著自動補送
  list.forEach(x=>{const k=keyOf(x.o);if(!Q[k])Q[k]={base:sig(dayItems(x.o)),orig:clone(dayItems(x.o))};Q[k].items=clone(x.items);Q[k].seq=++QSEQ;
    if(!QRUN&&Q[k].orig&&JSON.stringify(Q[k].orig)===JSON.stringify(Q[k].items))delete Q[k]});qPut();  // 改了又改回去＝不用送
  list.forEach(x=>setItems(x.o,clone(x.items)));persist();render();syncTxt();
  await new Promise(f=>setTimeout(f,400));await flushQ()  // 稍等一下，連續的改動合成一次送
}

function cardHTML(it,i){const n=parseNote(it.note);const dd=dueOf(it),fire=!it.done&&!n.nofire&&(n.fire||dd===cur.m+'/'+cur.d),late=dd&&!fire&&!it.done&&dueKey(dd)<+new Date(cur.y,cur.m-1,cur.d);const op=openIdx===i;

// ---- 運動連續天數：從今天（今天還沒做就從昨天）往回數，每天的「運動」都有打勾才算 ----
const EX='運動';
function exDone(o){const mm=M[ym(o.y,o.m)];if(!mm||!mm.days)return null;const it=(mm.days[o.d]||[]).find(x=>String(x.text).trim()===EX);return it?!!it.done:null}
function exStreak(){const t={y:T.getFullYear(),m:T.getMonth()+1,d:T.getDate()};let o=exDone(t)?t:addDays(t,-1),n=0;
  while(exDone(o)===true&&n<400){n++;o=addDays(o,-1)}return n}

// ---- 交期當天冒火：剪輯表交期＝這張卡片所在的那天 ----
const FLAME='<svg class="flame" width="15" height="19" viewBox="0 0 16 20" aria-label="今天交"><path d="M8 1c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-9z" fill="#F08A4B"/><path d="M8 10c.5 2 3 3 3 5.5a3 3 0 0 1-6 0c0-1.5 1-2 1-3.5 1 .5 1.5 1.5 1.5 2.5.5-1 .5-3 .5-4.5z" fill="#FFD27A"/></svg>';
// 這張卡片對應的剪輯表案子交期（即時讀，補填交期後重新同步就會出現）
function dueOf(it){if(!OPEN.length||it.span)return '';const c=caseOf(it.text);if(c&&/修改/.test(c.status||''))return '';  // 修改中：交期已過，不顯示
  const d=c?String(c.due).trim():'';return /^\d{1,2}\/\d{1,2}$/.test(d)?d:''}
function fireOn(it){const n=parseNote(it.note);return !n.nofire&&(n.fire||dueOf(it)===cur.m+'/'+cur.d)}
function dueToday(it){return dueOf(it)===cur.m+'/'+cur.d}

// ---- 快速輸入：從月曆上寫過的待辦整理出常用客戶和階段 ----
const STAGES=['剪輯','順剪','逐字','輸出','修改','交ac','交bc','交檔','Final','上片','封面'];
const FIXED_STAGES=['交bc','交檔','Final'];  // 一定出現的階段
function quickData(){const cl={},st={};
  Object.values(M).forEach(mm=>Object.values(mm.days||{}).forEach(list=>list.forEach(it=>{const t=String(it.text);if(t.indexOf('｜')<0)return;
    const c=t.split('｜')[0].trim();if(c&&c.length<=12&&!/\d/.test(c))cl[c]=(cl[c]||0)+1;
    t.split('｜').slice(1).join(' ').split(/[\s+＋、]+/).forEach(w=>{w=w.trim();if(w.length>=2&&w.length<=4&&!/\d/.test(w))st[w]=(st[w]||0)+1})})));
  const top=(o,n)=>Object.keys(o).sort((a,b)=>o[b]-o[a]).slice(0,n);
  const stages=STAGES.filter(w=>st[w]).sort((a,b)=>st[b]-st[a]).slice(0,10);
  const st2=FIXED_STAGES.concat(stages.filter(w=>FIXED_STAGES.indexOf(w)<0));stages.length=0;st2.forEach(w=>stages.push(w));  // 固定的放最前面，不用滑就看得到
  return {clients:top(cl,10),stages:stages.length?stages:STAGES.slice(0,6)}}
function quickHTML(){const q=quickData();if(!q.clients.length&&!q.stages.length)return '';
  return `<div class="qk">${q.clients.map(c=>`<span data-qc="${esc(c)}">${esc(c)}</span>`).join('')}</div><div class="qk st">${q.stages.map(w=>`<span data-qs="${esc(w)}">${esc(w)}</span>`).join('')}</div>`}
function bindQuick(){const t=$('#edT');if(!t)return;
  const put=v=>{t.value=v;edit.text=v;t.focus();try{t.setSelectionRange(v.length,v.length)}catch(e){}};
  // 輕點才算（放開時、幾乎沒移動）；左右滑看更多標籤不會誤觸。按下時 preventDefault 讓鍵盤不收起來
  const tap=(el,fn)=>{let sx=0,sy=0,ok=false;
    el.addEventListener('pointerdown',ev=>{ev.preventDefault();sx=ev.clientX;sy=ev.clientY;ok=true});
    el.addEventListener('pointermove',ev=>{if(ok&&(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6))ok=false});
    el.addEventListener('pointercancel',()=>{ok=false});
    el.addEventListener('pointerup',ev=>{if(!ok)return;ok=false;ev.preventDefault();haptic();
      el.animate([{transform:'scale(1)'},{transform:'scale(.86)',background:'#86739A',color:'#fff',offset:.35},{transform:'scale(1.08)',background:'#86739A',color:'#fff',offset:.7},{transform:'scale(1)'}],{duration:340,easing:'ease-out'});
      fn();t.animate([{backgroundColor:'#EBE2F1'},{backgroundColor:'transparent'}],{duration:500})})};
  document.querySelectorAll('[data-qc]').forEach(b=>tap(b,()=>{const v=t.value,i=v.indexOf('｜');put(b.dataset.qc+'｜'+(i>=0?v.slice(i+1):v.trim()))}));
  document.querySelectorAll('[data-qs]').forEach(b=>tap(b,()=>{const v=t.value.replace(/\s+$/,''),w=b.dataset.qs;
    if(!v){put(w);return}const last=v.split(/[\s｜]/).pop().split('+').pop();put(v+(STAGES.indexOf(last)>=0||quickData().stages.indexOf(last)>=0?'+':' ')+w)}))}

// ---- 同步狀態：開 App、切回來、下拉時，重新讀這週的月份，畫面上清楚顯示同步中／已是最新 ----
let syncing=null;
function syncPill(state,why){let p=$('#syncPill');if(!p){p=document.createElement('div');p.id='syncPill';document.body.appendChild(p)}
  clearTimeout(p._t);p.className=state;p.innerHTML=state==='ing'?'<i></i>同步中':state==='ok'?'<b>✓</b>已是最新':'同步失敗：'+esc(why||'稍後再試');
  if(state!=='ing')p._t=setTimeout(()=>{p.className=state+' out'},state==='ok'?1500:6000)}
let LASTSYNC=0;
function syncNow(quiet){if(syncing)return syncing;LASTSYNC=Date.now();if(!quiet){$('#list').classList.add('syncing');syncPill('ing')}
  // 月曆和待排一次讀完（伺服器那邊有快取，資料沒變就很快）
  const keys=[...new Set(weekOf(cur).map(o=>ym(o.y,o.m)).concat(DESK?deskKeys():[]))];
  const snap=()=>JSON.stringify([keys.map(k=>M[k]),PEND,OPEN,PER]);const before=quiet?snap():'';
  syncing=call('boot',{months:keys.map(k=>k.split('-').map(Number))}).then(r=>{
      Object.keys(r.months||{}).forEach(k=>{M[k]=normM(r.months[k]);delete STALE[k]});
      PEND=r.pending||[];OPEN=r.open||[];if(r.periods){PER=r.periods;PERC=null;try{localStorage.setItem('percache',JSON.stringify(PER))}catch(e){}}try{localStorage.setItem('pendcache',JSON.stringify({pending:PEND,open:OPEN}))}catch(e){}
      SYNCERR='';syncTxt();if(typeof CS!=='undefined'&&DESK&&PAGE!=='cal')CS.load(true);applyQ();persist();if(quiet&&snap()===before){if(qN())flushQ(true);return}  // 沒變就不重畫
      if(busyUI())renderPend();bgRender();if(!quiet)syncPill('ok');if(qN())flushQ(true)})
    .catch(e=>{const why=e&&e.message==='Failed to fetch'?'連不上網路':(e&&e.message)||'';SYNCERR=why||'稍後再試';syncTxt();if(!quiet)syncPill('err',why);if(qN())qLater()})
    .finally(()=>{$('#list').classList.remove('syncing');syncing=null});
  return syncing}

    root.querySelectorAll('[data-fxoff]').forEach(e=>e.onclick=async ev=>{ev.stopPropagation();const p=e.dataset.fxoff;if(await choose(`${p} 不續訂了？`,[['y','停用（之後可以恢復）']])!=='y')return;write('fxStop',{p,stop:true},`${p} 已停用`,()=>write('fxStop',{p,stop:false},'已恢復'))});
    root.querySelectorAll('[data-fxon]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const p=e.dataset.fxon;write('fxStop',{p,stop:false},`${p} 恢復使用`,()=>write('fxStop',{p,stop:true},'已改回停用'))});
    root.querySelectorAll('[data-fxamt]').forEach(e=>e.ondblclick=ev=>{ev.stopPropagation();const s=subs().find(x=>String(x.last.r)===e.dataset.fxamt);const v=prompt(`${s.p} 每月金額`,s.amt);if(v!=null&&v.trim())write('fxSet',{r:s.last.r,expect:s.p,amt:v},'已更新金額')});
    root.querySelectorAll('[data-open]').forEach(e=>{e.onmousedown=ev=>ev.stopPropagation();e.onclick=ev=>{ev.stopPropagation();const id=e.dataset.open;OPEN=OPEN===id?null:id;SEL=new Set([id]);MULTI=false;drawer();document.querySelectorAll('#desk tr.r[data-id]').forEach(x=>{x.classList.toggle('op',x.dataset.id===OPEN);x.classList.toggle('sel',x.dataset.id===id)})}});
    root.querySelectorAll('[data-stp]').forEach(e=>{e.onmousedown=ev=>ev.stopPropagation();e.onclick=ev=>{ev.stopPropagation();stMenu(e,byId(e.dataset.stp))}});
    root.querySelectorAll('[data-lk]').forEach(e=>{e.onmousedown=ev=>ev.stopPropagation();e.onclick=ev=>{ev.stopPropagation();lkMenu(e,byId(e.dataset.lk))}});
    const q=root.querySelector('#csQ');if(q){q.oninput=()=>{Q=q.value;const p=q.selectionStart;rerender();const n=$('#csQ');if(n){n.focus();n.setSelectionRange(p,p)}};q.onkeydown=e=>{e.stopPropagation();if(e.key==='Escape'){Q='';rerender()}}}
    const hb=root.querySelector('#csHelp');if(hb)hb.onclick=ev=>{if(ev.target.closest('.cshelp'))return;HELP=!HELP;rerender()};
    const nb=root.querySelector('#csNew');if(nb)nb.onclick=newCase;
    const order=[...root.querySelectorAll('tr.r[data-id]')].map(e=>e.dataset.id);
    root.querySelectorAll('tr.r[data-id]').forEach(e=>{const id=e.dataset.id;
      e.onmousedown=ev=>{if(ev.button!==0||ev.detail>1)return;
        if(ev.shiftKey){ev.preventDefault();if(!MULTI&&!(SEL.size===1&&!SEL.has(id)))SEL=new Set();if(SEL.has(id))SEL.delete(id);else SEL.add(id);LAST=id;DRAG=SEL.has(id);MULTI=true;rerender();return}
        SEL=new Set([id]);LAST=id;MULTI=false;document.querySelectorAll('tr.r.sel').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sumBar();highlight()};
      e.ondblclick=ev=>{clearTimeout(EDT);if(ev.target.closest('input,[data-stp],[data-lk],[data-open]'))return;const td=ev.target.closest('td.ed');if(td){inlineEdit(td,byId(id),td.dataset.f);return}return;document.querySelectorAll('tr.r.op').forEach(x=>x.classList.remove('op'));e.classList.add('op')};
      e.oncontextmenu=ev=>{ev.preventDefault();const o=byId(id);const m=pop(e,`<div class="it" data-a="open">打開詳細</div><div class="it" data-a="copy">複製專案名稱</div>${o.links.length?'<div class="it" data-a="link">打開連結</div>':''}<div class="it" data-a="del" style="color:#B5584E">刪除</div>`);m.style.left=Math.min(ev.clientX,innerWidth-m.offsetWidth-8)+'px';m.style.top=(ev.clientY+4)+'px';m.style.maxHeight='';m.style.overflowY='';fitMenu(m,{top:ev.clientY,bottom:ev.clientY});
        m.onclick=x=>{const a=(x.target.closest('[data-a]')||{}).dataset||{};m.remove();if(a.a==='open'){OPEN=id;drawer()}else if(a.a==='copy'){try{navigator.clipboard.writeText(o.title)}catch(e){}toast('已複製')}else if(a.a==='link')lkMenu(e,o);else if(a.a==='del')delCase(o)}};
      e.onmouseenter=ev=>{if(DRAG&&ev.buttons&&ev.shiftKey){SEL.add(id);rerender()}}});
    sumBar();drawer();highlight();fx(root)}
  function fx(root){const ease='cubic-bezier(.2,.8,.2,1)';
    if(FX.pop){root.querySelectorAll(`[data-stp="${FX.pop}"]`).forEach(p=>p.animate([{transform:'scale(.94)',opacity:.35,filter:'blur(1px)'},{transform:'scale(1)',opacity:1,filter:'blur(0)'}],{duration:420,easing:'cubic-bezier(.22,.8,.3,1)'}));FX.pop=null}
    if(FX.flash){const r=root.querySelector(`tr.r[data-id="${FX.flash}"]`);if(r){r.querySelectorAll('td').forEach(td=>td.animate([{background:'#FFF6DE'},{background:'#FFF6DE',offset:.25},{background:'transparent'}],{duration:1400,easing:'ease-out'}));const b=r.getBoundingClientRect();if(b.top<60||b.bottom>innerHeight-20)r.scrollIntoView({block:'center',behavior:'smooth'})}FX.flash=null}
    if(FX.open){const t=root.querySelector(`[data-sec="${FX.open}"]`);const tw=t&&t.parentNode.querySelector('.tw');if(tw)tw.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],{duration:240,easing:ease});FX.open=null}
    if(FX.month){const g=root.querySelectorAll(`tr.r`);root.querySelectorAll(`tr.g[data-m="${FX.month}"] ~ tr.r`).forEach((r,i)=>{if(i<40)r.animate([{opacity:0,transform:'translateY(-4px)'},{opacity:1,transform:'none'}],{duration:200,delay:i*12,easing:ease,fill:'backwards'})});FX.month=null}
    if(FX.cards){root.querySelectorAll('.ccard,.bigc').forEach((c,i)=>c.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:260,delay:i*35,easing:ease,fill:'backwards'}));FX.cards=false}}
  document.addEventListener('mouseup',()=>{DRAG=false});
  document.addEventListener('mousedown',ev=>{if(!OPEN)return;const t=ev.target;if(t.closest('.csdrw,tr.r,.cspm,.csov,.sheet,#toast,.cssum'))return;OPEN=null;drawer();document.querySelectorAll('tr.r.op').forEach(x=>x.classList.remove('op'))});
  function key(ev){const k=ev.key;if(NC&&!document.querySelector('.csnc'))NC=null;if(NC||document.querySelector('.csov')){if(k==='Escape'){NC=null;drawNC();document.querySelectorAll('.csov').forEach(x=>x.remove())}return true}
    if(k==='Escape'){if(OPEN){OPEN=null;drawer();rerender()}else if(SEL.size){SEL.clear();MULTI=false;rerender()}else if(HELP){HELP=false;rerender()}closeMenus();return true}
    if((k==='n'||k==='N')&&!ev.metaKey&&!ev.ctrlKey&&PAGE!=='cal'){ev.preventDefault();newCase();return true}
    if((k==='ArrowDown'||k==='ArrowUp')&&(PAGE==='case'||(PAGE==='split'&&SEL.size))){const tr=[...document.querySelectorAll('#desk tr.r[data-id]')],ids=tr.map(x=>x.dataset.id);if(!ids.length)return true;ev.preventDefault();
      const cur=OPEN||(SEL.size===1?[...SEL][0]:null);let i=cur?ids.indexOf(cur):-1;i=Math.max(0,Math.min(ids.length-1,i<0?0:i+(k==='ArrowDown'?1:-1)));const id=ids[i];SEL=new Set([id]);MULTI=false;LAST=id;if(OPEN)OPEN=id;
      tr.forEach(x=>x.classList.toggle('sel',x.dataset.id===id));tr.forEach(x=>x.classList.toggle('op',x.dataset.id===OPEN));tr[i].scrollIntoView({block:'nearest',behavior:'smooth'});if(OPEN)drawer();sumBar();highlight();return true}
    if(k==='Enter'&&SEL.size===1&&PAGE!=='cal'){ev.preventDefault();OPEN=OPEN===[...SEL][0]?null:[...SEL][0];drawer();document.querySelectorAll('#desk tr.r[data-id]').forEach(x=>x.classList.toggle('op',x.dataset.id===OPEN));return true}
    if(k==='/'&&PAGE!=='cal'){ev.preventDefault();const q=$('#csQ');if(q)q.focus();return true}
    if((k==='Delete'||k==='Backspace')&&PAGE!=='cal'&&PAGE!=='split'){const o=SEL.size===1?byId([...SEL][0]):null;if(o){ev.preventDefault();delCase(o)}return true}
    return PAGE!=='cal'&&PAGE!=='split'}
  const busy=()=>!!NC||!!document.querySelector('.csov,td.ing,.csdrw .ing')||DRAG;
  function searchInto(el,q){if(!el)return;const Q0=Q;Q=q||'';setTimeout(()=>{Q=Q0},0);if(!q||!D){el.innerHTML='';return}const ql=q.toLowerCase();
    const l=ROWS.filter(r=>(r.title+' '+r.client+' '+r.src+' '+r.memo+' '+r.mynote).toLowerCase().includes(ql)).sort((a,b)=>(closed(a)-closed(b))||((b.intake||0)-(a.intake||0))).slice(0,8);
    el.innerHTML=l.length?'<div class="srh">案件</div>'+l.map(r=>`<div class="res csres" data-cid="${r.id}"><span class="dt">${esc(r.mlabel.replace(/^\d{4}\//,''))} 月</span><span class="t">${hl(r.title)}<small>　${esc(r.client)}</small></span><span class="st ${ST[r.st]||'s-none'}" style="cursor:pointer">${esc(r.st||'未開始')}</span></div>`).join(''):'';
    el.querySelectorAll('[data-cid]').forEach(x=>x.onclick=()=>{$('#ovl').innerHTML='';openCase(x.dataset.cid)})}
  function openCase(id){const o=byId(id);if(!o)return;PAGE='case';try{localStorage.setItem('deskPage','case')}catch(e){}FS='全部';Q='';if(closed(o)){COL['已結案']=false;MCOL[o.mkey]=false}SEL=new Set([id]);OPEN=id;FX.flash=id;renderDesk();drawer()}
  return {searchInto,openCase,load,page,tools,bind,splitPanel,key,busy,newCase,drawer,rows:()=>ROWS,has:()=>!!D,highlight,cardsFx:()=>{FX.cards=true}};
})();

$('#fab').onclick=()=>{haptic();openEdit(-1)};
$('#moBtn').onclick=()=>slideGo({y:T.getFullYear(),m:T.getMonth()+1,d:T.getDate()});
$('#srBtn').onclick=openSearch;
$('#inBtn').onclick=openIncome;
$('#tdBtn').onclick=()=>openPicker('jump');
window.addEventListener('resize',render);
setDesk();syncNow();go(cur);
autoReceipt();
// 自動更新：回到 App 時檢查網站上有沒有新版，有就重新載入
const VER=/*VER*/'20261113111239';
async function checkVer(){if(VER==='dev')return;try{const t=await (await fetch('./?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/\/\*VER\*\/'(\w+)'/);if(m&&m[1]!==VER&&!edit&&!touchedSinceVisible){let n=0;try{n=+sessionStorage.getItem('upd-'+m[1])||0;sessionStorage.setItem('upd-'+m[1],n+1)}catch(e){}if(n<2)location.replace(location.pathname+'?v='+m[1]+location.hash)}}catch(e){}}
checkVer();
// 電腦視窗常常一直開著：點回 App 視窗時同步，開著時每 1 分鐘也悄悄同步一次（手機改的會自己跑過來）
addEventListener('focus',()=>{if(!edit&&!D&&Date.now()-LASTSYNC>10000)syncNow(true)});
setInterval(()=>{if(document.visibilityState==='visible'&&!busyUI()&&!pending&&Date.now()-LASTSYNC>55000)syncNow(true)},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){touchedSinceVisible=false;checkVer();if(!edit&&!D)syncNow()}});
</script>
