<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趙辰心｜影片剪輯師作品集</title>
<meta name="description" content="短影音、長影音、業配與主持節目作品集。擅長字卡設計、敘事節奏與整體調性。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="趙辰心｜影片剪輯師">
<meta property="og:title" content="趙辰心｜影片剪輯師作品集">
<meta property="og:description" content="短影音、長影音、業配與主持節目作品集。擅長字卡設計、敘事節奏與整體調性。">
<meta property="og:url" content="https://zhaochenxin-editor.netlify.app/">
<meta property="og:image" content="https://zhaochenxin-editor.netlify.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#FAFAFA;
    --surface:#FFFFFF;
    --border:#E9E9EE;
    --text:#1F2024;
    --text-secondary:#7A7A85;
    --text-tertiary:#A6A6AF;
    --accent:#AB92BF;
    --accent-hover:#8F76A6;
    --accent-light:#F2ECF5;
    --accent-deep:#655A7C;
    --accent-deep-hover:#544A69;
    --radius:18px;
    --radius-sm:8px;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow-card: 0 1px 2px rgba(30,20,60,0.05), 0 10px 28px rgba(30,20,60,0.08);
    --shadow-card-hover: 0 2px 4px rgba(30,20,60,0.06), 0 16px 36px rgba(30,20,60,0.12);
    --shadow-soft: 0 2px 4px rgba(30,20,60,0.08), 0 14px 28px rgba(30,20,60,0.12);
    --shadow-inset: inset 0 1px 3px rgba(30,20,60,0.08);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .page{ max-width:1120px; margin:0 auto; padding:0 24px; }

  /* ---------- Intro ---------- */
  .intro{
    text-align:center;
    padding:56px 24px 28px;
    border-bottom:1px solid var(--border);
  }
  .avatar-ring{
    width:100px; height:100px; border-radius:50%;
    padding:3px;
    background:conic-gradient(from 200deg, var(--accent), transparent 55%, var(--accent));
    margin:0 auto 20px;
    box-shadow:var(--shadow-soft);
  }
  .avatar-inner{
    width:100%; height:100%; border-radius:50%;
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .avatar-inner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-inner .initial{
    font-size:32px; font-weight:600; color:var(--accent);
  }
  .name{
    font-size:26px; font-weight:700; margin:0 0 12px;
    letter-spacing:0.5px;
  }
  .role-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12.5px; letter-spacing:0.04em;
    color:var(--text-secondary);
    border:1px solid var(--border);
    padding:6px 16px; border-radius:999px;
  }
  .role-badge .dot{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .role-note{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:fit-content;
    margin:14px auto 0; padding:8px 18px;
    background:var(--accent-light); border-radius:999px;
    font-size:12.5px; color:var(--accent-deep);
    line-height:1.6;
  }
  .role-note .dot2{
    width:4px; height:4px; border-radius:50%; background:var(--accent-deep); flex-shrink:0;
  }

  /* ---------- Main Tabs ---------- */
  .main-tabs{
    display:inline-flex; justify-content:flex-start;
    gap:4px;
    margin:22px auto 0;
    padding:6px;
    max-width:100%;
    overflow-x:auto;
    scrollbar-width:none;
    background:var(--surface);
    border-radius:999px;
    box-shadow:var(--shadow-inset);
  }
  .main-tabs-row{ display:flex; justify-content:center; padding:0 8px; }
  .main-tabs::-webkit-scrollbar{ display:none; }
  .main-tab-btn{
    appearance:none; border:none; background:none;
    cursor:pointer;
    font-family:inherit;
    font-size:15px; font-weight:600;
    color:var(--text-secondary);
    padding:10px 18px;
    border-radius:999px;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .main-tab-btn:hover{ color:var(--text); }
  .main-tab-btn.active{
    background:var(--accent-light);
    color:var(--accent);
  }

  /* ---------- Sub Tabs ---------- */
  .sub-tabs{
    display:flex; justify-content:flex-start;
    gap:24px; flex-wrap:wrap;
    padding:18px 18px 0;
  }
  .sub-tabs:empty{ padding:0; }
  .sub-tab-btn{
    appearance:none; cursor:pointer;
    font-family:inherit;
    font-size:14px; font-weight:500;
    color:var(--text-secondary);
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:4px 0 8px;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .sub-tab-btn:hover{ color:var(--accent); }
  .sub-tab-btn.active{
    color:var(--accent);
    font-weight:700;
    border-bottom-color:var(--accent);
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px;
    padding:36px 8px 72px;
  }
  @media (max-width:900px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:640px){
    .grid{ grid-template-columns:1fr; padding:28px 8px 56px; }
    .intro{ padding:48px 20px 32px; }
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow-card);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .card:hover{
    box-shadow:var(--shadow-card-hover);
    transform:translateY(-2px);
  }
  .video-wrap{
    position:relative;
    width:100%;
    aspect-ratio:4 / 5; /* 跟 IG Reels 封面同比例，裁切位置才會對 */
    background:#111;
    overflow:hidden;
    cursor:pointer;
  }
  .video-wrap.full-reveal{
    aspect-ratio:16 / 9; /* 長影音維持原始比例，縮圖完整露出不裁切 */
  }
  .video-wrap.full-reveal .thumb-img{
    object-fit:contain;
  }
  .thumb-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:1;
  }
  .play-btn{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,0.92);
    border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 18px rgba(0,0,0,0.28);
    transition:transform .15s ease;
    padding:0;
    z-index:3;
  }
  .play-btn svg{ width:20px; height:20px; fill:var(--accent); margin-left:3px; }
  .video-wrap:hover .play-btn{ transform:translate(-50%,-50%) scale(1.08); }
  .video-wrap iframe{
    position:absolute; inset:0;
    width:100%; height:100%; border:0;
  }
  .card-body{
    padding:18px 18px 20px;
    display:flex; flex-direction:column; gap:10px;
    flex:1;
  }
  .card-client{
    font-size:12px; font-weight:600; margin:0;
    color:var(--accent);
    letter-spacing:0.02em;
  }
  .card-title{
    font-size:16px; font-weight:700; margin:0;
    color:var(--text);
    line-height:1.35;
    min-height:2.7em;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-desc{
    font-size:13.5px; color:var(--text-secondary);
    margin:0;
  }
  .tags{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .tag{
    font-size:12px; font-weight:600;
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .card-meta{
    margin-top:auto;
    padding-top:8px;
    min-height:29px;
    display:flex; align-items:center; flex-wrap:wrap;
    gap:10px;
    font-size:13px;
  }
  .watch-link{
    margin-left:auto;
    color:var(--accent);
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
  }
  .watch-link:hover{ text-decoration:underline; }

  /* ---------- Empty state card ---------- */
  .card-empty{
    background:var(--accent-light);
    border:none;
    box-shadow:none;
  }
  .card-empty:hover{ transform:none; box-shadow:none; }
  .card-empty .video-wrap{
    background:transparent;
    cursor:default;
    display:flex; align-items:center; justify-content:center;
  }
  .card-empty .card-body{
    align-items:center; justify-content:flex-start;
    text-align:center;
    padding-top:20px;
  }
  .empty-icon{
    width:36px; height:36px; border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    gap:3px;
  }
  .empty-icon span{
    width:5px; height:5px; border-radius:50%; background:var(--accent-deep);
  }
  .card-empty p{
    margin:0; font-size:14px; font-weight:600; color:var(--accent-deep);
  }

  /* ---------- Footer ---------- */
  .contact{
    border-top:1px solid var(--border);
    text-align:center;
    padding:48px 24px 64px;
  }
  .contact h2{
    font-size:18px; font-weight:700; margin:0 0 18px;
  }
  .contact-info{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
    margin-bottom:28px; max-width:760px; margin-left:auto; margin-right:auto;
  }
  @media (max-width:480px){
    .contact-info{ grid-template-columns:repeat(2, 1fr); }
  }
  .contact-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:16px 6px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  a.contact-card:hover{ border-color:var(--accent); background:var(--accent-light); }
  .contact-icon{
    width:36px; height:36px; border-radius:50%;
    background:var(--accent-light); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
  }
  .contact-icon svg{ width:18px; height:18px; }
  .contact-label{ font-size:11.5px; color:var(--text-tertiary); }
  .contact-value{ font-size:12.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow-wrap:normal; }
  .resume-btn{
    display:inline-block;
    background:var(--accent-light);
    color:var(--accent-deep);
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    padding:12px 28px;
    border-radius:999px;
    border:1px solid rgba(101,90,124,0.14);
    box-shadow:0 2px 8px rgba(101,90,124,0.10);
    transition:background .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .resume-btn:hover{
    background:#E9E0F0;
    box-shadow:0 4px 14px rgba(101,90,124,0.16);
    transform:translateY(-1px);
  }

  /* ---------- Source link icon ---------- */
  .watch-link.src-link{
    width:28px; height:28px;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%;
    color:var(--text-tertiary);
    transition:background .15s ease, color .15s ease;
  }
  .watch-link.src-link:hover{ color:var(--accent-deep); background:var(--accent-light); text-decoration:none; }
  .watch-link.src-link svg{ width:17px; height:17px; }

  /* ---------- Creators strip ---------- */
  .creators{ padding:22px 0 6px; border-bottom:1px solid var(--border); }
  .cr-head{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    margin-bottom:20px; text-align:center;
  }
  .cr-head .t{ font-size:22px; font-weight:700; color:var(--text); letter-spacing:0.08em; }
  .cr-head .t::after{ content:""; display:block; width:38px; height:3px; border-radius:3px; background:var(--accent); margin:9px auto 0; }
  .cr-head .s{ font-size:12.5px; color:var(--text-secondary); letter-spacing:0.04em; margin-top:6px; }
  .cr-wrap{ position:relative; max-width:1120px; margin:0 auto; }
  .cr-row{
    display:flex; gap:18px; overflow-x:auto;
    scroll-snap-type:x proximity; scroll-padding:0 40px;
    padding:4px 40px 14px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);
            mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);
  }
  .cr-row::-webkit-scrollbar{ display:none; }
  .cr-item{ flex:0 0 auto; width:72px; display:flex; flex-direction:column; align-items:center; gap:8px; scroll-snap-align:start; }
  .cr-av{
    position:relative; width:60px; height:60px; border-radius:50%; overflow:hidden;
    background:var(--accent-light); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700;
    border:1px solid rgba(171,146,191,0.35);
    box-shadow:var(--shadow-card);
  }
  .cr-av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .cr-name{ font-size:11.5px; color:var(--text-secondary); text-align:center; line-height:1.3; max-width:72px; }
  .cr-arrow{
    position:absolute; top:15px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface); color:var(--accent-deep);
    box-shadow:var(--shadow-card); cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1;
    z-index:2; transition:opacity .15s ease;
  }
  .cr-arrow.l{ left:6px; } .cr-arrow.r{ right:6px; }
  .cr-arrow.hide{ opacity:0; pointer-events:none; }
  @media (max-width:640px){ .cr-arrow{ display:none; } }

  /* ---------- Play loading spinner ---------- */
  .play-btn.loading{ pointer-events:none; }
  .play-btn.loading svg{ display:none; }
  .play-btn.loading::after{
    content:""; width:24px; height:24px; border-radius:50%;
    border:3px solid var(--accent-light); border-top-color:var(--accent);
    animation:playspin .8s linear infinite;
  }
  @keyframes playspin{ to{ transform:rotate(360deg); } }
  .play-btn svg.ext{ fill:none; stroke:var(--accent); margin-left:0; }

  /* ---------- Mobile: show the work sooner ---------- */
  @media (max-width:640px){
    .intro{ padding:24px 16px 16px; }
    .avatar-ring{ width:76px; height:76px; margin-bottom:12px; }
    .name{ font-size:22px; margin-bottom:8px; }
    .role-badge{ font-size:12px; padding:5px 14px; }
    .role-note{ margin-top:10px; padding:7px 14px; font-size:12px; }
    .creators{ padding:14px 0 2px; }
    .cr-head{ margin-bottom:12px; gap:3px; }
    .cr-head .t{ font-size:18px; }
    .cr-head .t::after{ width:30px; margin-top:7px; }
    .cr-head .s{ font-size:11.5px; margin-top:4px; }
    .cr-row{ gap:14px; padding-bottom:8px; }
    .cr-item{ width:70px; gap:6px; }
    .cr-av{ width:52px; height:52px; font-size:13px; }
    .cr-name{ font-size:11px; max-width:70px; }
    .main-tabs{ margin-top:14px; }
    .sub-tabs{ padding-top:12px; }
    .grid{ padding-top:16px; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="intro">
    <div class="avatar-ring">
      <div class="avatar-inner"><img src="頭貼.jpg" alt="趙辰心"></div>
    </div>
    <h1 class="name">趙辰心</h1>
    <p class="role-badge"><span class="dot"></span>剪輯師 / 影像設計 / 專案管理</p>
    <p class="role-note"><span class="dot2"></span>以下作品皆為本人親自剪輯；標籤僅標示個別影片中額外參與的項目。</p>
  </header>
  <section class="creators" aria-label="合作過的創作者">
    <div class="cr-head"><span class="t">合作過的創作者</span><span class="s">醫師、診所、Podcast 與內容創作者</span></div>
    <div class="cr-wrap">
      <button class="cr-arrow l hide" id="crPrev" type="button" aria-label="向左">&#8249;</button>
      <div class="cr-row" id="crRow"></div>
      <button class="cr-arrow r" id="crNext" type="button" aria-label="向右">&#8250;</button>
    </div>
  </section>

  <div class="main-tabs-row"><nav class="main-tabs" id="mainTabs"></nav></div>
  <nav class="sub-tabs" id="subTabs"></nav>
  <main class="grid" id="cardGrid"></main>

  <footer class="contact">
    <h2>聯絡我</h2>
    <div class="contact-info">
      <a class="contact-card" href="mailto:easyjaw@gmail.com">
        <span class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
        <span class="contact-label">Email</span>
        <span class="contact-value">easyjaw@gmail.com</span>
      </a>
      <div class="contact-card">
        <span class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <span class="contact-label">電話</span>
        <span class="contact-value">0928-253-231</span>
      </div>
      <a class="contact-card" href="https://www.instagram.com/zhao.cx_/" target="_blank" rel="noopener">
        <span class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/></svg></span>
        <span class="contact-label">Instagram</span>
        <span class="contact-value">@zhao.cx_</span>
      </a>
      <a class="contact-card" href="https://line.me/ti/p/6Cres4_N0O" target="_blank" rel="noopener">
        <span class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <span class="contact-label">LINE</span>
        <span class="contact-value">加好友</span>
      </a>
    </div>
    <a class="resume-btn" href="resume.pdf" target="_blank" rel="noopener">下載履歷 PDF</a>
  </footer>
</div>

<script>
/* ============ 標籤設定 ============ */
// 依優先順序排序（企劃 > 外包協作 > 拍攝 > 字卡設計/畫面設計，主持企劃頁另用 主持/企劃）
const TAG_PRIORITY = ["企劃","委託剪輯","拍攝","字卡設計","畫面設計","主持"];
const TAG_COLORS = {
  "企劃":     { bg:"#FBEEF2", color:"#A34D6B" },
  "委託剪輯": { bg:"#FBF3EA", color:"#A3733E" },
  "拍攝":     { bg:"#EAF5F1", color:"#3E8A73" },
  "字卡設計": { bg:"#EEF1FC", color:"#4C5FD5" },
  "畫面設計": { bg:"#FDEEEE", color:"#C2554B" },
  // 「主持」配色未於需求中指定，暫用與強調色同色系的淺紫，確認排版後可再調整
  "主持":     { bg:"#F1EEFC", color:"#6C4AB6" }
};

/* ============ 合作過的創作者（頭貼放 創作者/<名稱>.jpg，沒有就顯示文字圓圈） ============ */
const CREATORS = [
  ["High咖","High咖與品妤Baby"],["嗨咖","嗨咖"],["品妤","品妤"],["阿瑞","阿瑞"],

  ["侯鈞元","侯鈞元"]

function renderCreators(){
  const row = document.getElementById("crRow");
  if(!row) return;
  row.innerHTML = CREATORS.map(([ini,name])=>
    `<div class="cr-item"><span class="cr-av"><span>${ini}</span><img src="創作者/${name}.jpg" alt="${name}" loading="lazy" onerror="this.remove()"></span><span class="cr-name">${name}</span></div>`
  ).join("");
  const prev = document.getElementById("crPrev"), next = document.getElementById("crNext");
  const upd = ()=>{
    prev.classList.toggle("hide", row.scrollLeft < 4);
    next.classList.toggle("hide", row.scrollLeft + row.clientWidth >= row.scrollWidth - 4);
  };
  row.addEventListener("scroll", upd, {passive:true});
  window.addEventListener("resize", upd);
  prev.onclick = ()=>row.scrollBy({left:-row.clientWidth*0.7, behavior:"smooth"});
  next.onclick = ()=>row.scrollBy({left: row.clientWidth*0.7, behavior:"smooth"});
  upd();
}

/* ============ 狀態 ============ */
const mainTabKeys = Object.keys(DATA);
let state = {
  main: mainTabKeys[0],
  sub: DATA[mainTabKeys[0]].subtabs ? Object.keys(DATA[mainTabKeys[0]].subtabs)[0] : null
};

/* ============ 渲染 ============ */
function sortTags(tags){
  return [...tags].sort((a,b) => TAG_PRIORITY.indexOf(a) - TAG_PRIORITY.indexOf(b));
}

function renderMainTabs(){
  const el = document.getElementById("mainTabs");
  el.innerHTML = mainTabKeys.map(key => `
    <button class="main-tab-btn ${state.main===key?'active':''}" data-main="${key}">
      ${DATA[key].label}
    </button>
  `).join("");
  el.querySelectorAll(".main-tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.main = btn.dataset.main;
      const section = DATA[state.main];
      state.sub = section.subtabs ? Object.keys(section.subtabs)[0] : null;
      renderAll();
    });
  });
}

function renderSubTabs(){
  const el = document.getElementById("subTabs");
  const section = DATA[state.main];
  if(!section.subtabs){ el.innerHTML = ""; return; }
  const subKeys = Object.keys(section.subtabs);
  el.innerHTML = subKeys.map(key => `
    <button class="sub-tab-btn ${state.sub===key?'active':''}" data-sub="${key}">
      ${section.subtabs[key].label}
    </button>
  `).join("");
  el.querySelectorAll(".sub-tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.sub = btn.dataset.sub;
      renderGrid();
      syncHash();
      el.querySelectorAll(".sub-tab-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
}

const ICON_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>';
const ICON_YT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>';

// 這些 IG 貼文目前無法內嵌（IG 回報貼文已移除或限制內嵌），點播放改為開啟原帖；修好後把代碼從這裡刪掉即可
const NO_EMBED = new Set(["DVTCj5iDHkt","DWgSVN-ABmM"]);
const ICON_EXT = '<svg class="ext" viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

// 播放來源一律跟著「上架內容」連結走（創作者原帖），不使用自己頻道的複本
function embedInfo(item){
  const l = item.link || "";
  let m = l.match(/instagram\.com\/(?:[^\/]+\/)?(reel|reels|p|tv)\/([\w-]+)/);
  if(m){
    const type = m[1] === "reels" ? "reel" : m[1];
    const ext = NO_EMBED.has(m[2]);
    return { kind:"ig", ext, src: ext ? "" : `https://www.instagram.com/${type}/${m[2]}/embed`, icon:ICON_IG, label:"前往 Instagram 原帖" };
  }
  m = l.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  const id = m ? m[1] : item.youtubeId;
  return { kind:"yt", src:`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`, icon:ICON_YT, label:"前往 YouTube 原片" };
}

function cardHTML(item, fullReveal){
  const info = embedInfo(item);
  const tagsHTML = (item.tags && item.tags.length)
    ? `<div class="tags">${sortTags(item.tags).map(t=>{
        const c = TAG_COLORS[t] || {bg:"#EEE", color:"#666"};
        return `<span class="tag" style="background:${c.bg};color:${c.color}">${t}</span>`;
      }).join("")}</div>`
    : "";

  const clientHTML = item.client ? `<p class="card-client">${item.client}</p>` : "";
  const descHTML = item.desc ? `<p class="card-desc">${item.desc}</p>` : "";

  const metaHTML = `
    <div class="card-meta">
      ${tagsHTML}
      ${item.link ? `<a class="watch-link src-link" href="${item.link}" target="_blank" rel="noopener" title="${info.label}" aria-label="${info.label}">${info.icon}</a>` : ""}
    </div>`;

  return `
    <div class="card">
      <div class="video-wrap ${fullReveal ? 'full-reveal' : ''} ${item.thumb ? '' : 'auto-thumb'}" data-embed="${info.src}"${info.ext ? ` data-href="${item.link}"` : ""}>
        <img class="thumb-img" src="${item.thumb ? item.thumb : 'https://i.ytimg.com/vi/' + item.youtubeId + '/hqdefault.jpg'}" alt="${item.title}" loading="lazy">
        <button class="play-btn" aria-label="播放影片" type="button">
          ${info.ext ? ICON_EXT : ICON_PLAY}
        </button>
      </div>
      <div class="card-body">
        ${clientHTML}
        <h3 class="card-title">${item.title}</h3>
        ${descHTML}
        ${metaHTML}
      </div>
    </div>
  `;
}

function emptyCardHTML(fullReveal){
  return `
    <div class="card card-empty">
      <div class="video-wrap ${fullReveal ? 'full-reveal' : ''}">
        <div class="empty-icon"><span></span><span></span><span></span></div>
      </div>
      <div class="card-body">
        <p>更多作品集持續更新中</p>
      </div>
    </div>
  `;
}

function renderGrid(){
  const el = document.getElementById("cardGrid");
  const section = DATA[state.main];
  let items, showEmpty;

  if(section.subtabs){
    const sub = section.subtabs[state.sub];
    items = sub.items;
    showEmpty = sub.showEmpty;
  } else {
    items = section.items;
    showEmpty = section.showEmpty;
  }

  const fullReveal = state.main === "long" || state.main === "host";
  let html = items.map(item => cardHTML(item, fullReveal)).join("");
  if(showEmpty) html += emptyCardHTML(fullReveal);
  el.innerHTML = html;
}

function applyHash(){
  const [m, s] = decodeURIComponent(location.hash.slice(1)).split("/");
  if(!m || !DATA[m]) return;
  state.main = m;
  const subs = DATA[m].subtabs;
  state.sub = subs ? (subs[s] ? s : Object.keys(subs)[0]) : null;
}
function syncHash(){
  const isDefault = state.main === mainTabKeys[0] &&
    (!DATA[state.main].subtabs || state.sub === Object.keys(DATA[state.main].subtabs)[0]);
  const h = isDefault ? "" : "#" + state.main + (state.sub ? "/" + state.sub : "");
  try { history.replaceState(null, "", location.pathname + location.search + h); } catch(e){}
}

function renderAll(){
  renderMainTabs();
  renderSubTabs();
  renderGrid();
  syncHash();
}

document.getElementById("cardGrid").addEventListener("click", (e)=>{
  const wrap = e.target.closest(".video-wrap");
  if(wrap && wrap.dataset.href){ window.open(wrap.dataset.href, "_blank", "noopener"); return; }
  if(!wrap || !wrap.dataset.embed || wrap.classList.contains("playing")) return;
  wrap.classList.add("playing");
  const src = wrap.dataset.embed;
  const ig = src.includes("instagram.com");
  const btn = wrap.querySelector(".play-btn");
  if(btn) btn.classList.add("loading");

  const f = document.createElement("iframe");
  f.title = "影片播放";
  f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
  f.allowFullscreen = true;
  if(ig) f.setAttribute("scrolling", "no");
  f.style.cssText = "opacity:0; pointer-events:none; z-index:2; transition:opacity .25s ease;";

  let shown = false;
  const reveal = ()=>{
    if(shown) return; shown = true;
    f.style.opacity = "1"; f.style.pointerEvents = "auto";
    setTimeout(()=>wrap.querySelectorAll(".thumb-img,.play-btn").forEach(n=>n.remove()), 300);
  };
  // IG 內嵌載入完成後還要再幾秒才會畫出影片，先保留封面與轉圈
  f.addEventListener("load", ()=>setTimeout(reveal, ig ? 2500 : 800));
  setTimeout(reveal, 15000);
  f.src = src;
  wrap.appendChild(f);
});

applyHash();
renderAll();
renderCreators();
window.addEventListener("hashchange", ()=>{ applyHash(); renderAll(); });
</script>
