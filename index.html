<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="月曆">
<meta name="theme-color" content="#F2F1EE">
<title>月曆</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#F2F1EE;--card:#FFFFFF;--line:#E6E4DF;--tx:#262624;--mu:#9B9993;--dim:#B8B8B4;--ac:#262624;--ac2:#C5AECF;--ink:#262624;--hol:#B5584E;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:var(--tx);background:transparent;border:none;outline:none;padding:0;margin:0;-webkit-appearance:none;appearance:none;border-radius:0;box-shadow:none}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 12px calc(env(safe-area-inset-bottom) + 80px);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.mo{font-size:17px;font-weight:600;display:flex;align-items:center;gap:5px}
.mo i{font-size:16px;color:var(--mu)}
.top .r{display:flex;gap:14px;align-items:center}.top .r i{font-size:18px;color:var(--mu)}
.sync{font-size:8.5px;color:var(--dim)}
.strip{display:flex;gap:4px;margin-bottom:14px}
.strip .s{flex:1;text-align:center;padding:7px 0;font-size:9.5px;color:var(--mu);border-radius:10px;background:#FAFAF8}
.strip .s b{display:block;font-size:13px;font-weight:600;color:var(--tx)}
.strip .s.hol b{color:var(--hol)}
.strip .s.td{box-shadow:inset 0 0 0 1px var(--ac)}
.strip .s.on{background:var(--ink)}.strip .s.on,.strip .s.on b{color:var(--bg)}
.strip .s.drop{background:#E6E4DF}
.dh{display:flex;align-items:center;gap:6px;margin:0 2px 8px;min-height:18px}
.dh b{font-size:16px;font-weight:600}.dh .w{font-size:10px;color:var(--mu)}
.tag{font-size:9.5px;border-radius:6px;padding:1px 6px;background:#E6E4DF;color:#6B6964}
.tag.h{background:#F3E2DF;color:var(--hol)}
.dh .mv{margin-left:auto;font-size:10px;color:var(--mu);display:flex;align-items:center;gap:3px}
#list{min-height:55vh;touch-action:pan-y}
.card{display:block;border-radius:12px;padding:0 13px;margin-bottom:8px;background:var(--card);box-shadow:var(--sh);position:relative;user-select:none;-webkit-user-select:none}
.card .row1{display:flex;align-items:center;gap:12px;height:46px}
.card .ck{width:16px;height:16px;border-radius:5px;border:1.4px solid #D2D0CA;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--bg)}
.card.x .ck{background:var(--ac);border-color:var(--ac)}.card.x .tx{text-decoration:line-through;color:var(--dim)}
.card .ckw{padding:10px 4px 10px 0;margin-left:-2px}
.card .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:10px;max-width:42%;overflow:hidden;color:var(--mu);flex-shrink:0;display:flex;gap:4px;align-items:center}
.card .mt i{font-size:11px}.card .mt .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .det{border-top:1px solid #EFEDE9;padding:8px 0 11px 28px;font-size:11px;color:#5E5C57}
.card .det div{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px;line-height:1.5}
.card .det i{font-size:13px;color:var(--mu);margin-top:1px}
.card .det .none{color:var(--dim)}
.card .eb{margin-top:6px;font-size:11px;font-weight:600;color:var(--tx);padding:5px 12px;border-radius:8px;background:#F2F1EE;display:inline-flex;gap:4px;align-items:center}
.card .bar{width:4px;height:20px;border-radius:2px;flex-shrink:0;opacity:.55}
.card.dragging{opacity:.95;box-shadow:0 8px 20px rgba(60,50,40,.18);z-index:5}
.card.ph{opacity:.25}
.card.new{background:var(--card);border:1px solid #D2D0CA;box-shadow:none;display:flex;align-items:center;gap:12px;height:46px}
.card.new input{flex:1;min-width:0;height:22px;font-size:12px;caret-color:var(--ac)}
.tools{display:flex;gap:16px;margin:4px 4px 10px;font-size:16px;color:var(--mu);align-items:center}
.tools .on{color:var(--ac)}
.tools .sp{flex:1}
.tools .cx,.tools .ok{font-size:12px}.tools .ok{color:var(--ac);font-weight:600}
.tools .del{color:#C98}
.pane{margin:0 4px 10px}
.line{display:flex;align-items:center;gap:8px}
.line i{font-size:11px;color:var(--ac);width:12px}
.line input{flex:1;font-size:12px;line-height:22px;border-bottom:1px solid #D6D0C7;caret-color:var(--ac)}
.line input:focus{border-bottom-color:var(--ac)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw span{width:20px;height:20px;border-radius:5px;opacity:.75}
.sw span.on{outline:1.2px solid var(--ac);outline-offset:2px}
.sw .none{border:1px solid #D2D0CA;background:#fff;opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:11px;padding:5px 12px;border-radius:8px;background:var(--card);color:var(--mu)}
.chips span.on{background:var(--ink);color:var(--bg)}
.wheel{position:relative;display:flex;justify-content:center;gap:18px;height:90px;overflow:hidden}
.wheel .hl{position:absolute;left:25%;right:25%;top:36px;height:18px;border-top:1px solid #E0DAD1;border-bottom:1px solid #E0DAD1;pointer-events:none}
.wheel .col{height:90px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;width:42px;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel .col::-webkit-scrollbar{display:none}
.wheel .col div{height:18px;line-height:18px;scroll-snap-align:center;font-size:12.5px;color:var(--mu)}
.wheel .col div.sel{color:var(--tx);font-size:12px}
.wheel .colon{line-height:90px;color:var(--mu)}
.wf{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px}.wf .set{color:var(--ac)}.wf button{color:var(--mu)}
.empty{color:var(--dim);text-align:center;padding:32px 0;font-size:12px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(60,50,40,.25);z-index:10}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:12px;display:flex;gap:16px;align-items:center;z-index:30;box-shadow:0 4px 14px rgba(60,50,40,.25);max-width:90vw}
.toast button{color:var(--ac2);font-weight:500}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;padding:calc(env(safe-area-inset-top) + 28px) 14px 20px;overflow-y:auto}
.ov .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ov .h b{font-weight:600;font-size:15px}.ov .h i{font-size:16px;color:var(--ac);padding:4px 8px}
.wk,.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:10px;color:var(--mu);padding-bottom:6px}
.mg div{padding:10px 0 6px;font-size:13px;border-radius:10px}
.mg div.on{background:var(--ink);color:var(--bg)}
.mg div.td{box-shadow:inset 0 0 0 1px var(--ac)}
.mg div.hol{color:var(--hol)}
.mg div.sel{background:#E6E4DF}
.mg .d{display:block;width:4px;height:4px;border-radius:2px;background:#9B9993;margin:2px auto 0;opacity:.8}
.mg div.on .d{background:var(--bg)}
.ov .note{margin-top:16px;text-align:center;font-size:11px;color:var(--mu)}
.ov .btn{display:block;margin:16px auto 0;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 18px;font-weight:500}
.sr{display:flex;align-items:center;gap:8px;border-bottom:1px solid #D6D0C7;padding-bottom:4px;margin-bottom:12px}
.sr i{color:var(--ac);font-size:16px}.sr input{flex:1;font-size:14px}
.res{display:flex;gap:10px;padding:10px 11px;margin-bottom:7px;background:var(--card);border-radius:10px}
.res .dt{color:var(--mu);font-size:11px;width:54px;flex-shrink:0}
.res.x .t{text-decoration:line-through;color:var(--dim)}
/* 橫拿：整週 */
#week{display:none}
@media (orientation:landscape) and (min-width:560px){
  #app{max-width:none;padding-bottom:20px}
  #day,.fab{display:none!important}
  #week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wc{background:var(--card);border-radius:10px;padding:7px;min-height:70vh}
  .wc .h{font-size:9px;color:var(--mu);margin-bottom:5px;display:flex;justify-content:space-between}
  .wc .h b{color:var(--tx);font-size:11px;font-weight:500}
  .wc.td{box-shadow:inset 0 0 0 1.5px var(--ac)}
  .wc.hol .h b{color:var(--hol)}
  .wc .p{font-size:9.5px;border-radius:6px;padding:3px 6px;margin-bottom:4px;background:#F2F1EE;line-height:1.35;word-break:break-all}
  .wc .p.x{text-decoration:line-through;opacity:.45}
  .wc .hn{font-size:8px;color:var(--hol);margin-bottom:4px}
}

/* 放大觸控範圍（手機好按） */
html,body{font-size:14px}
.mo{font-size:19px}.top .r{gap:20px}.top .r i{font-size:22px}.top .r button,.mo{padding:6px 0}
.strip .s{padding:9px 0;font-size:10.5px}.strip .s b{font-size:15px}
.dh b{font-size:18px}.dh .w,.dh .mv{font-size:11.5px}.tag{font-size:10.5px;padding:2px 7px}
.card .row1{height:56px;gap:14px}.card .ck{width:20px;height:20px;border-radius:6px;font-size:11px}
.card .ckw{padding:16px 10px 16px 2px;margin-left:-4px}
.card .mt{font-size:11.5px}.card .mt i{font-size:13px}.card .bar{height:24px;width:5px}
.card .det{font-size:13px;padding-left:34px}.card .eb{font-size:13px;padding:8px 16px}
.card.new{height:56px}.card.new input{font-size:14px;height:26px}
.tools{gap:6px;font-size:20px}.tools button{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.tools .cx,.tools .ok{font-size:14px;min-width:48px}
.line input{font-size:14px;line-height:30px}.sw span{width:28px;height:28px;border-radius:8px}.sw{gap:12px}
.chips span{font-size:13px;padding:8px 16px}
.wheel{height:150px}.wheel .col{height:150px;width:60px}.wheel .col div{height:30px;line-height:30px;font-size:16px}.wheel .colon{line-height:150px}.wheel .hl{top:60px;height:30px}
.wf{font-size:14px}.wf button{padding:8px 0}
.fab{width:58px;height:58px;font-size:26px;border-radius:16px}
.toast{font-size:14px;padding:12px 18px}
.mg div{padding:13px 0 8px;font-size:15px}.wk span{font-size:11.5px}.ov .h b{font-size:17px}.ov .h i{font-size:22px}
.res{padding:14px}.res .dt{font-size:12.5px;width:60px}.sr input{font-size:16px}
.empty{font-size:14px}

/* 編輯頁 */
.ov.ed{padding-top:calc(env(safe-area-inset-top) + 22px)}
.eh{display:flex;justify-content:space-between;align-items:center;height:52px;margin-bottom:6px}
.eh b{font-size:16px;font-weight:600}
.eh button{font-size:16px;color:var(--mu);padding:10px 4px;min-width:56px;text-align:left}
.eh .ok{color:var(--tx);font-weight:600;text-align:right}
.grp{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden}
.grp .big{width:100%;font-size:18px;padding:16px;line-height:1.4}
.rw{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-bottom:1px solid #EFEDE9;width:100%;text-align:left;font-size:15px}
.rw:last-child{border-bottom:none}
.rw.top{align-items:flex-start;padding-top:16px;padding-bottom:12px}
.rw>i{font-size:20px;color:var(--mu);flex-shrink:0}
.rw .k{width:44px;flex-shrink:0;color:var(--mu);font-size:14px}
.rw input,.rw textarea{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--tx);background:transparent;border:none;outline:none;resize:none;padding:0;line-height:1.5}
.rw .v{flex:1;font-size:15px}.rw .v.ph{color:var(--dim)}
.rw .ch{font-size:18px;color:var(--dim)}
.rw .x{width:30px;height:30px;border-radius:15px;background:#EFEDE9;color:var(--mu);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.rw .sw{flex:1;gap:12px}.rw .sw span{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.rw .sw .none{color:var(--dim);font-size:16px}
.rw .chips{flex:1;gap:6px;flex-wrap:nowrap}.rw .chips span{background:#F2F1EE;font-size:12.5px;padding:8px 10px;white-space:nowrap}.rw .chips span.on{background:var(--ink);color:#fff}
.rw.act{font-size:15px;color:var(--tx);gap:12px}.rw.act i{font-size:20px;color:var(--mu)}
.rw.del,.rw.del i{color:var(--hol)}
.ed .pane{padding:4px 14px 12px;border-bottom:1px solid #EFEDE9}

/* 動態與觸控 */
#app{overflow-x:hidden;overflow-x:clip}
button,.strip .s,.chips span,.sw span,.mg div,.res{transition:transform .12s ease,opacity .12s}
button:active,.strip .s:active,.chips span:active,.sw span:active,.mg div:active,.res:active{transform:scale(.93);opacity:.7}
.rw:active{opacity:.6}
.fab{transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.9);opacity:1}
.cw{position:relative;margin-bottom:8px;border-radius:12px;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.cw .card{margin:0;z-index:1;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
.cw.press .card{transform:scale(.975);background:#FAFAF8}
.sa{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;padding:0 26px;font-size:22px;color:#fff;opacity:0;transition:opacity .15s}
.sa.l{background:#6E7F5C;justify-content:flex-start}
.sa.r{background:var(--hol);justify-content:flex-end}
.cw.dragging{z-index:5;transition:none}
.cw.dragging .card{transform:scale(1.03);box-shadow:0 14px 30px rgba(60,50,40,.22)}
.card.x .tx{text-decoration:none}
.card .tx span{background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0 1.3px}
.card.x .tx span{background-size:100% 1.3px}
.card.pop.x .tx span{animation:strike .32s ease-out}
.card.pop:not(.x) .tx span{animation:unstrike .22s ease-in}
.card.pop .ck{animation:ckpop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes strike{from{background-size:0 1.3px}}
@keyframes unstrike{from{background-size:100% 1.3px}}
@keyframes ckpop{0%{transform:scale(.55)}100%{transform:scale(1)}}
.card .det{overflow:hidden}
.ov.ed.in{animation:edup .36s cubic-bezier(.2,.85,.25,1)}
@keyframes edup{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:#D6D3CD;margin:0 auto 2px}
.toast{animation:tin .26s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
.card.tn .ck{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.16)}
.card.tn .mt{color:rgba(38,38,36,.5)}
.card .ck i{font-size:14px;-webkit-text-stroke:.6px currentColor}
.card.x.tn .ck{background:var(--ac);border-color:var(--ac)}
.inc{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:18px}
.inc div{background:var(--card);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--mu)}
.inc b{display:block;font-size:24px;font-weight:600;color:var(--tx);margin-top:2px}
.inc div.hi{background:#EBE2F1}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}.mh b{font-size:15px;font-weight:600}.mh span{font-size:11px;color:var(--mu)}
.mb{background:var(--card);border-radius:12px;padding:8px 14px}
.mr{display:grid;grid-template-columns:38px 1fr;gap:4px 10px;align-items:center;padding:7px 0;font-size:13px}
.mr .tk{height:10px;border-radius:5px;background:#F2F1EE;overflow:hidden;position:relative}
.mr .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.mr .v{grid-column:2;font-size:12px;color:var(--mu);margin-top:-2px}.mr .v b{color:var(--tx);font-weight:600}
.mr.now .m{font-weight:600}
.pend-h{display:flex;align-items:center;gap:8px;width:100%;margin:18px 2px 8px;font-size:13px;color:var(--mu)}
.pend-h b{background:var(--ink);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:600}
.pend-h i{margin-left:auto;font-size:16px;transition:transform .2s}.pend-h.cl i{transform:rotate(-90deg)}
.pi{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;margin-bottom:8px;border-radius:12px;background:#FAFAF8;border:1px solid #E6E4DF;user-select:none;-webkit-user-select:none;transition:transform .15s,opacity .15s}
.pi:active{transform:scale(.98)}
.pi .pt{flex:1;min-width:0}.pi .pt small{display:block;font-size:11px;color:var(--mu)}.pi .pt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.pi .du{font-size:11px;color:var(--mu);flex-shrink:0;text-align:right}.pi .du.soon{color:var(--hol);font-weight:600}
.pi .gr{color:var(--dim);font-size:18px}
.pghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 14px 30px rgba(60,50,40,.22);transform:scale(1.03);background:#fff;opacity:.97}
.sheet{position:fixed;inset:0;z-index:35;background:rgba(38,38,36,.28);display:flex;align-items:flex-end;animation:fdin .2s}
.sheet .bx{width:100%;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);animation:edup .3s cubic-bezier(.2,.85,.25,1)}
.sheet .tt{font-size:12px;color:var(--mu);padding:2px 4px 10px}.sheet .tt b{display:block;font-size:15px;color:var(--tx);font-weight:600;margin-top:2px}
.sheet button{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;background:#fff;border-radius:12px;margin-bottom:8px;font-size:15px}
.sheet button i{font-size:19px;color:var(--mu)}.sheet button.cx{justify-content:center;background:none;color:var(--mu)}
@keyframes fdin{from{opacity:0}}
#day.hasp #list{min-height:0}
.sa{pointer-events:none}.sa.on{pointer-events:auto;z-index:0}
#backZone{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:64px;z-index:30;border-radius:16px;border:1.5px solid #C9C6BF;background:rgba(250,250,248,.95);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--mu);animation:tin .2s;transition:background .15s,color .15s,transform .15s}
#backZone i{font-size:20px}
#backZone.hot{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.03)}
</style>
</head>
<body>
<div id="app">
  <div class="top"><button class="mo" id="moBtn"><i class="ti ti-calendar-month"></i><span id="moTxt"></span></button><div class="r"><span class="sync" id="sync"></span><button id="inBtn" aria-label="收入"><i class="ti ti-coin"></i></button><button id="srBtn"><i class="ti ti-search"></i></button><button id="tdBtn"><i class="ti ti-calendar-event"></i></button></div></div>
  <div class="strip" id="strip"></div>
  <div id="day"><div class="dh" id="dh"></div><div id="list"></div><div id="pend"></div></div>
  <div id="week"></div>
</div>
<button class="fab" id="fab"><i class="ti ti-plus"></i></button>
<div id="ovl"></div>
<div id="toast"></div>
<script>
// 試算表裡的顏色一律換成 4 種低彩度色調顯示；App 裡選色時寫回對應的淡色
const TONES=[['#B5665E','#F6DCD9'],['#A27A62','#F5E6DC'],['#768462','#E6EEDB'],['#5F7F89','#DDE9ED'],['#86739A','#EBE2F1']]; // [色票, 卡片底色＝寫回試算表的顏色]：紅、橘棕、綠、藍、紫
function tone(hex){if(!hex||!/^#[0-9a-f]{6}$/i.test(hex))return '';const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dl=mx-mn;if(dl<0.035||(l>0.975))return '';const sat=dl/(1-Math.abs(2*l-1));if(sat<0.12)return '';let h=mx===r?((g-b)/dl)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4;h=(h*60+360)%360;const i=(h>=345||h<18)?0:h<70?1:h<170?2:h<245?3:4;return TONES[i][0]}
const fillOf=hex=>{const t=tone(hex);const c=TONES.find(x=>x[0]===t);return c?c[1]:''};
const WD='日一二三四五六';
const M={};               // 已載入的月份資料
const T=new Date();
let cur={y:T.getFullYear(),m:T.getMonth()+1,d:T.getDate()};
let edit=null;            // 正在編輯的待辦
let openIdx=-1;           // 展開看詳細的卡片
let pending=0;
let PEND=[],OPEN=[],POPEN=true,PDRAG=false;try{POPEN=localStorage.getItem('pendOpen')!=='0'}catch(e){}
let POP=-1,JO=-1,ED_IN=false,SW=null,SLIDING=false;  // 動畫狀態：剛打勾、剛展開、編輯頁剛打開、左滑露出刪除、換天中
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// iPhone 網頁沒有震動 API；iOS 18 起點一下「開關」核取方塊會有輕微觸感
let HP=null;
function haptic(){try{if(navigator.vibrate){navigator.vibrate(12);return}if(!HP){HP=document.createElement('label');HP.style.display='none';HP.innerHTML='<input type="checkbox" switch>';document.body.appendChild(HP)}HP.click()}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=(y,m)=>y+'-'+m;
const keyOf=o=>o.y+'-'+o.m+'-'+o.d;
const addDays=(o,n)=>{const t=new Date(o.y,o.m-1,o.d+n);return {y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}};
const isToday=o=>o.y===T.getFullYear()&&o.m===T.getMonth()+1&&o.d===T.getDate();
const same=(a,b)=>a.y===b.y&&a.m===b.m&&a.d===b.d;
const dayItems=o=>{const mm=M[ym(o.y,o.m)];return mm&&mm.days[o.d]?mm.days[o.d]:[]};
const setItems=(o,list)=>{const k=ym(o.y,o.m);if(!M[k])M[k]={y:o.y,m:o.m,exists:true,days:{},holidays:{}};M[k].days[o.d]=list};
const holiday=o=>{const mm=M[ym(o.y,o.m)];return mm&&mm.holidays?mm.holidays[o.d]:''};
const sig=l=>l.map(i=>String(i.text).trim()+'|'+(i.done?1:0));
const clone=x=>JSON.parse(JSON.stringify(x));

// 後端 API（Google Apps Script）。金鑰只存在這支手機/電腦，不在程式碼裡
const API='https://script.google.com/macros/s/AKfycbxkTq8peIBj3mjRBetSUJw4mDtBmyNt0WGsFx7RBk9J2EdvEAF89xSWXao5TWIdniwPmA/exec';
function getKey(){
  const h=location.hash.match(/k=([0-9a-f]+)/);
  if(h){try{localStorage.setItem('calkey',h[1])}catch(e){}return h[1]}
  try{return localStorage.getItem('calkey')||''}catch(e){return ''}
}
let KEY=getKey();
addEventListener('hashchange',()=>{if(getKey()){KEY=getKey();location.reload()}});
function askKey(){const k=prompt('請貼上月曆金鑰');if(k){KEY=k.trim();try{localStorage.setItem('calkey',KEY)}catch(e){}}return KEY}
async function call(action,payload){
  if(!KEY)KEY=getKey();
  if(!KEY&&!askKey())throw new Error('沒有金鑰');
  pending++;syncTxt();
  try{
    const res=await fetch(API,{method:'POST',body:JSON.stringify({t:KEY,action,payload:payload||{}})});
    const r=await res.json();
    if(r.auth===false){try{localStorage.removeItem('calkey')}catch(e){}KEY='';throw new Error('金鑰錯誤，請重新整理後再貼一次')}
    if(r.ok||r.conflict)return r;
    throw new Error(r.error);
  }finally{pending--;syncTxt()}
}
function syncTxt(){$('#sync').textContent=pending?'同步中…':''}
function absorb(r){if(r&&r.months){Object.keys(r.months).forEach(k=>{M[k]=r.months[k];delete STALE[k]});persist()}}
const INF={};
// 手機裡存一份最近幾個月，打開先顯示，再背景同步（STALE＝還沒跟試算表確認過）
const STALE={};
function persist(){try{const keep={};const n=T.getFullYear()*12+T.getMonth();Object.keys(M).forEach(k=>{const [y,m]=k.split('-').map(Number);if(Math.abs(y*12+m-1-n)<=1)keep[k]=M[k]});localStorage.setItem('calcache',JSON.stringify(keep))}catch(e){}}
try{const c=JSON.parse(localStorage.getItem('calcache')||'{}');Object.keys(c).forEach(k=>{M[k]=c[k];STALE[k]=1})}catch(e){}
async function loadMonth(y,m,force){const k=ym(y,m);if(M[k]&&!force&&!STALE[k])return M[k];if(INF[k])return INF[k];INF[k]=call('month',{y,m}).then(r=>{M[k]=r.month;delete STALE[k];persist();return M[k]}).finally(()=>delete INF[k]);return INF[k]}

// ---- 備註（時間/地點/備註）存在試算表附註 ----
function parseNote(n){const o={tm:'',pl:'',nt:''},rest=[];String(n||'').split('\n').forEach(l=>{let t;if(t=l.match(/^時間[:：]\s*(.*)$/))o.tm=t[1];else if(t=l.match(/^地點[:：]\s*(.*)$/))o.pl=t[1];else if(t=l.match(/^備註[:：]\s*(.*)$/))rest.push(t[1]);else if(l.trim())rest.push(l)});o.nt=rest.join(' ');return o}
function makeNote(o){return [o.tm?'時間：'+o.tm:'',o.pl?'地點：'+o.pl:'',o.nt?'備註：'+o.nt:''].filter(Boolean).join('\n')}
const tint=c=>'';

// ---- 存檔（先更新畫面，再寫回試算表） ----
async function save(list){ // list:[{o,items}]
  const changes=list.map(x=>({key:keyOf(x.o),base:sig(dayItems(x.o)),items:x.items}));
  const backup=list.map(x=>({o:x.o,items:clone(dayItems(x.o))}));
  list.forEach(x=>setItems(x.o,clone(x.items)));render();
  try{const r=await call('save',{changes});absorb(r);if(r.conflict)toast('試算表在別處被改過，已重新整理');render()}
  catch(e){backup.forEach(x=>setItems(x.o,x.items));render();toast('沒存成功：'+(e.message||e))}
}

// ---- 畫面 ----
function weekOf(o){const t=new Date(o.y,o.m-1,o.d),off=(t.getDay()+6)%7;return [...Array(7)].map((_,i)=>addDays(o,i-off))}
function render(){
  $('#moTxt').textContent=cur.y+' 年 '+cur.m+' 月';
  const wk=weekOf(cur);
  $('#strip').innerHTML=wk.map((o,i)=>`<div class="s ${same(o,cur)?'on':''} ${isToday(o)?'td':''} ${holiday(o)?'hol':''}" data-i="${i}">${WD[new Date(o.y,o.m-1,o.d).getDay()]}<b>${o.d}</b></div>`).join('');
  $('#strip').querySelectorAll('.s').forEach(s=>s.onclick=()=>slideGo(wk[+s.dataset.i]));
  const items=dayItems(cur),h=holiday(cur),undone=items.filter(i=>!i.done).length;
  $('#dh').innerHTML=`<b>${cur.m}/${cur.d}</b><span class="w">週${WD[new Date(cur.y,cur.m-1,cur.d).getDay()]}</span>${h?`<span class="tag h">${esc(h)}</span>`:''}${isToday(cur)?'<span class="tag">今天</span>':''}${undone&&!edit?`<button class="mv" id="mvBtn"><i class="ti ti-arrow-forward"></i>未完成移到明天</button>`:''}`;
  const mv=$('#mvBtn');if(mv)mv.onclick=moveUnfinished;
  let html=items.map((it,i)=>cardHTML(it,i)).join('');
  if(!items.length)html='<div class="empty">這天還沒有安排</div>';
  $('#list').innerHTML=html;
  bindList();
  renderPend();
  if(JO>=0){const det=document.querySelector(`#list .cw[data-i="${JO}"] .det`);if(det){const h=det.offsetHeight;det.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px',opacity:0},{height:h+'px',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'})}}
  $('#fab').style.display=edit?'none':'flex';
  renderWeek(wk);
  if(edit&&!PK){$('#ovl').innerHTML=sheetHTML();ED_IN=false;bindEditor()}else if(!edit&&$('#ovl .ed'))$('#ovl').innerHTML='';
}
function cardHTML(it,i){const n=parseNote(it.note);const fl=fillOf(it.bg);const op=openIdx===i;
  const det=op?`<div class="det">${n.tm?`<div><i class="ti ti-clock"></i>${esc(n.tm)}</div>`:''}${n.pl?`<div><i class="ti ti-map-pin"></i>${esc(n.pl)}</div>`:''}${n.nt?`<div><i class="ti ti-notes"></i>${esc(n.nt)}</div>`:''}${!n.tm&&!n.pl&&!n.nt?'<div class="none">沒有時間、地點或備註</div>':''}<button class="eb"><i class="ti ti-pencil"></i>編輯</button></div>`:'';
  return `<div class="cw" data-i="${i}"><div class="sa l" data-done="${i}"><i class="ti ti-check"></i></div><div class="sa r" data-del="${i}"><i class="ti ti-trash"></i></div><div class="card ${it.done?'x':''} ${POP===i?'pop':''} ${fl?'tn':''}" ${fl?`style="background:${fl}"`:''}><div class="row1"><span class="ckw" data-ck="${i}"><span class="ck">${it.done?'<i class="ti ti-check"></i>':''}</span></span><span class="tx"><span>${esc(it.text)}</span></span><span class="mt">${n.tm?esc(n.tm):''}${n.pl?`<i class="ti ti-map-pin"></i><span class="pl">${esc(n.pl)}</span>`:''}${n.nt?'<i class="ti ti-notes"></i>':''}</span></div>${det}</div></div>`}
function renderWeek(wk){
  $('#week').innerHTML=wk.map(o=>{const h=holiday(o);return `<div class="wc ${isToday(o)?'td':''} ${h?'hol':''}"><div class="h"><b>${o.m}/${o.d}</b><span>週${WD[new Date(o.y,o.m-1,o.d).getDay()]}</span></div>${h?`<div class="hn">${esc(h)}</div>`:''}${dayItems(o).map(it=>{const t=tone(it.bg);return `<div class="p ${it.done?'x':''}" style="${fillOf(it.bg)?'background:'+fillOf(it.bg):''}">${esc(it.text)}</div>`}).join('')}</div>`}).join('');
}

// ---- 編輯／新增 ----
function sheetHTML(){const e=edit;const it=e.idx>=0?dayItems(cur)[e.idx]:null;const clr=f=>`<button class="x" data-clr="${f}" aria-label="清除"><i class="ti ti-x"></i></button>`;
  return `<div class="ov ed ${ED_IN?'in':''}"><div class="grab"></div><div class="eh"><button id="edCx">取消</button><b>${it?'編輯':'新增'}　${cur.m}/${cur.d}</b><button class="ok" id="edOk">完成</button></div>
  <div class="grp"><input id="edT" class="big" value="${esc(e.text)}"></div>
  <div class="grp">
   <div class="rw" id="rTm"><i class="ti ti-clock"></i><span class="k">時間</span><span class="v ${e.tm?'':'ph'}">${e.tm||'無'}</span>${e.tm?clr('tm'):'<i class="ti ti-chevron-right ch"></i>'}</div>
   ${e.f==='tm'?`<div class="pane">${wheelHTML()}</div>`:''}
   <div class="rw"><i class="ti ti-map-pin"></i><span class="k">地點</span><input id="edPl" value="${esc(e.pl)}">${e.pl?clr('pl'):''}</div>
   <div class="rw top"><i class="ti ti-notes"></i><span class="k">備註</span><textarea id="edNt" rows="2">${esc(e.nt)}</textarea>${e.nt?clr('nt'):''}</div>
  </div>
  <div class="grp">
   <div class="rw"><i class="ti ti-droplet"></i><span class="k">顏色</span><div class="sw">${TONES.map(c=>`<span data-col="${c[1]}" class="${tone(e.bg)===c[0]?'on':''}" style="background:${c[0]}"></span>`).join('')}<span data-col="" class="none ${!tone(e.bg)?'on':''}"><i class="ti ti-ban"></i></span></div></div>
   <div class="rw"><i class="ti ti-repeat"></i><span class="k">重複</span><div class="chips">${[['','不重複'],['day','每天'],['week','每週'],['month','每月']].map(r=>`<span data-rp="${r[0]}" class="${(e.rp||'')===r[0]?'on':''}">${r[1]}</span>`).join('')}</div></div>
  </div>
  ${it?`<div class="grp"><button class="rw act" id="edCp"><i class="ti ti-copy"></i>複製到其他天</button><button class="rw act del" id="edDel"><i class="ti ti-trash"></i>刪除這件</button></div>`:''}
  </div>`}
function wheelHTML(){const e=edit,p=(e.tm||'14:00').split(':');e.wh=e.wh??+p[0];e.wm=e.wm??Math.round(+p[1]/5)*5%60;
  return `<div class="wheel"><div class="hl"></div><div class="col" id="wh"><div></div><div></div>${[...Array(24)].map((_,i)=>`<div class="${i===e.wh?'sel':''}">${String(i).padStart(2,'0')}</div>`).join('')}<div></div><div></div></div><div class="colon">:</div><div class="col" id="wm"><div></div><div></div>${[...Array(12)].map((_,i)=>`<div class="${i*5===e.wm?'sel':''}">${String(i*5).padStart(2,'0')}</div>`).join('')}<div></div><div></div></div></div><div class="wf"><button id="wClr">不設時間</button><button class="set" id="wSet">設定 ${String(e.wh).padStart(2,'0')}:${String(e.wm).padStart(2,'0')}</button></div>`}
function openEdit(idx){const it=idx>=0?dayItems(cur)[idx]:null;const n=parseNote(it?it.note:'');edit={idx,text:it?it.text:'',bg:it?it.bg:'',tm:n.tm,pl:n.pl,nt:n.nt,rp:'',f:''};ED_IN=true;render();const t=$('#edT');if(t&&idx<0)t.focus()}
function syncEdit(){const t=$('#edT');if(t)edit.text=t.value;const pl=$('#edPl');if(pl)edit.pl=pl.value;const nt=$('#edNt');if(nt)edit.nt=nt.value}
function bindEditor(){
  const keep=(sync=true)=>{if(sync)syncEdit();const st=$('#ovl .ov')?$('#ovl .ov').scrollTop:0;render();const o=$('#ovl .ov');if(o)o.scrollTop=st};
  $('#rTm').onclick=ev=>{if(ev.target.closest('[data-clr]'))return;edit.f=edit.f==='tm'?'':'tm';keep()};
  document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();syncEdit();edit[b.dataset.clr]='';if(b.dataset.clr==='tm')edit.f='';keep(false)});
  document.querySelectorAll('[data-col]').forEach(x=>x.onclick=()=>{edit.bg=x.dataset.col;keep()});
  document.querySelectorAll('[data-rp]').forEach(x=>x.onclick=()=>{edit.rp=x.dataset.rp;keep()});
  $('#edCx').onclick=closeEdit;
  const ov=$('#ovl .ed');let py=null,pdy=0;
  const ps=e=>{if(ov.scrollTop>0)return;py=e.touches[0].clientY;pdy=0;ov.style.transition='none'};
  const pm=e=>{if(py===null)return;pdy=Math.max(0,e.touches[0].clientY-py);if(pdy>4){e.preventDefault();ov.style.transform=`translateY(${pdy}px)`}};
  const pe=()=>{if(py===null)return;py=null;if(pdy>110)closeEdit();else{ov.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';ov.style.transform=''}};
  [$('#ovl .grab'),$('#ovl .eh')].forEach(el=>{el.addEventListener('touchstart',ps,{passive:true});el.addEventListener('touchmove',pm,{passive:false});el.addEventListener('touchend',pe)});
  $('#edOk').onclick=finishEdit;
  const t=$('#edT');t.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();finishEdit()}};
  const d=$('#edDel');if(d)d.onclick=async()=>{const i=edit.idx;await slideOutEd();edit=null;$('#ovl').innerHTML='';removeAt(i)};
  const cp=$('#edCp');if(cp)cp.onclick=()=>{syncEdit();openPicker('copy')};
  const wh=$('#wh'),wm=$('#wm');
  if(wh){wh.scrollTop=edit.wh*30;wm.scrollTop=(edit.wm/5)*30;let a,b;
    const upd=()=>{$('#wSet').textContent='設定 '+String(edit.wh).padStart(2,'0')+':'+String(edit.wm).padStart(2,'0');[...wh.children].forEach((c,i)=>c.classList.toggle('sel',i-2===edit.wh));[...wm.children].forEach((c,i)=>c.classList.toggle('sel',(i-2)*5===edit.wm))};
    wh.onscroll=()=>{clearTimeout(a);a=setTimeout(()=>{edit.wh=Math.max(0,Math.min(23,Math.round(wh.scrollTop/30)));upd()},60)};
    wm.onscroll=()=>{clearTimeout(b);b=setTimeout(()=>{edit.wm=Math.max(0,Math.min(55,Math.round(wm.scrollTop/30)*5));upd()},60)};
    $('#wSet').onclick=()=>{edit.tm=String(edit.wh).padStart(2,'0')+':'+String(edit.wm).padStart(2,'0');edit.f='';keep()};
    $('#wClr').onclick=()=>{edit.tm='';edit.f='';keep()};}
}
function slideOutEd(){const o=$('#ovl .ed');if(!o)return Promise.resolve();o.style.transition='transform .24s cubic-bezier(.4,0,1,1)';o.style.transform='translateY(100%)';return wait(230)}
async function closeEdit(){await slideOutEd();edit=null;$('#ovl').innerHTML='';render()}
async function finishEdit(){syncEdit();const e=edit;const text=e.text.trim();if(!text){$('#edT').focus();return}
  if(document.activeElement)document.activeElement.blur();await slideOutEd();
  const items=clone(dayItems(cur));const note=makeNote(e);
  edit=null;$('#ovl').innerHTML='';
  if(e.idx===-1&&e.rp){render();try{const r=await call('repeat',{rule:{text,type:e.rp,start:keyOf(cur),bg:e.bg,note}});absorb(r);render();toast('已建立重複待辦')}catch(err){toast('沒存成功：'+(err.message||err))}return}
  if(e.idx===-1)items.push({text,done:false,bg:e.bg,fc:'',bold:false,note});
  else Object.assign(items[e.idx],{text,bg:e.bg,note});
  await save([{o:cur,items}]);
  if(e.idx>=0&&e.rp){try{const r=await call('repeat',{rule:{text,type:e.rp,start:keyOf(addDays(cur,1)),bg:e.bg,note}});absorb(r);render();toast('之後會重複出現')}catch(err){toast('重複沒設定成功')}}
}
function toggle(i){const items=clone(dayItems(cur));items[i].done=!items[i].done;POP=i;haptic();save([{o:cur,items}]);setTimeout(()=>{POP=-1},500)}
let undoTimer;
function removeAt(i){const items=clone(dayItems(cur));const gone=items.splice(i,1)[0];const o={...cur};save([{o,items}]);
  toast('已刪除',()=>{const now=clone(dayItems(o));now.splice(Math.min(i,now.length),0,gone);save([{o,items:now}])})}
async function moveUnfinished(){const nx=addDays(cur,1);await loadMonth(nx.y,nx.m);const items=clone(dayItems(cur));const keep=items.filter(i=>i.done),move=items.filter(i=>!i.done);
  save([{o:{...cur},items:keep},{o:nx,items:clone(dayItems(nx)).concat(move)}]);toast(`已把 ${move.length} 件移到 ${nx.m}/${nx.d}`)}

// ---- 列表互動：打勾、點開、長按拖曳、左滑刪除、右滑完成 ----
function bindList(){
  document.querySelectorAll('[data-ck]').forEach(c=>c.onclick=ev=>{ev.stopPropagation();toggle(+c.dataset.ck)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();swipeDelete(b.closest('.cw'))});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();closeSwipe();toggle(+b.dataset.done)});
  document.querySelectorAll('#list .cw').forEach(cw=>{
    const card=cw.querySelector('.card'),sl=cw.querySelector('.sa.l'),sr=cw.querySelector('.sa.r'),i=+cw.dataset.i;
    let timer=null,dragging=false,sx=0,sy=0,lock=null,tgt=null,dx=0,base=0,t0=0,hit=false;
    const setX=(x,anim)=>{card.style.transition=anim?'':'none';card.style.transform=x?`translateX(${x}px)`:'';sl.style.opacity=x>0?Math.min(1,x/60):0;sr.style.opacity=x<0?Math.min(1,-x/60):0;sl.classList.toggle('on',x>0);sr.classList.toggle('on',x<0)};
    const start=(x,y,t)=>{tgt=t;sx=x;sy=y;lock=null;dx=0;t0=Date.now();base=SW===cw?(+cw.dataset.off||0):0;if(SW&&SW!==cw)closeSwipe();cw.classList.add('press');
      timer=setTimeout(()=>{if(lock)return;cw.classList.remove('press');dragging=true;haptic();beginDrag(cw,y)},420)};
    const move=(x,y,ev)=>{if(dragging){ev.preventDefault();dragMove(x,y);return}
      if(!lock&&(Math.abs(x-sx)>8||Math.abs(y-sy)>8)){lock=Math.abs(x-sx)>Math.abs(y-sy)?'h':'v';clearTimeout(timer);cw.classList.remove('press');hit=false}
      if(lock==='h'){ev.preventDefault();dx=Math.max(-110,Math.min(110,x-sx+base));setX(dx);const over=Math.abs(dx)>50;if(over!==hit){hit=over;if(over)haptic()}}};
    const end=()=>{clearTimeout(timer);cw.classList.remove('press');
      if(dragging){dragging=false;dragEnd();return}
      if(lock==='h'){ // 只露出按鈕，要再點一下才完成／刪除
        if(dx>50){setX(88,true);SW=cw;cw.dataset.off=88;return}
        if(dx<-50){setX(-88,true);SW=cw;cw.dataset.off=-88;return}
        setX(0,true);if(SW===cw)SW=null;cw.dataset.off=0;return}
      if(lock==='v')return;
      if(base){closeSwipe();return}
      if(tgt&&tgt.closest&&tgt.closest('.eb')){openIdx=-1;openEdit(i);return}
      setOpen(openIdx===i?-1:i)};
    card.addEventListener('touchstart',ev=>{if(ev.target.closest('[data-ck]'))return;const t=ev.touches[0];start(t.clientX,t.clientY,ev.target)},{passive:true});
    card.addEventListener('touchmove',ev=>{const t=ev.touches[0];move(t.clientX,t.clientY,ev)},{passive:false});
    card.addEventListener('touchend',ev=>{if(ev.target.closest('[data-ck]'))return;ev.preventDefault();end()});
    card.addEventListener('mousedown',ev=>{if(ev.target.closest('[data-ck]'))return;start(ev.clientX,ev.clientY,ev.target);const mm=e=>move(e.clientX,e.clientY,e),mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);end()};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu)});
  });
}
function closeSwipe(){if(!SW)return;SW.dataset.off=0;const c=SW.querySelector('.card');c.style.transition='';c.style.transform='';SW.querySelectorAll('.sa').forEach(x=>{x.style.opacity=0;x.classList.remove('on')});SW=null}
async function swipeDelete(cw){const i=+cw.dataset.i,c=cw.querySelector('.card');SW=null;haptic();
  c.style.transition='transform .2s cubic-bezier(.4,0,1,1)';c.style.transform='translateX(-110%)';cw.querySelector('.sa.r').style.opacity=1;await wait(170);
  cw.style.overflow='hidden';await cw.animate([{height:cw.offsetHeight+'px',marginBottom:'8px',opacity:1},{height:'0px',marginBottom:'0px',opacity:0}],{duration:200,easing:'ease-in',fill:'forwards'}).finished;
  removeAt(i)}
// 展開／收起：先把舊的收起來，再展開新的
async function setOpen(n){const old=document.querySelector('#list .det');
  if(old){const h=old.offsetHeight;await old.animate([{height:h+'px',opacity:1},{height:'0px',paddingTop:'0px',paddingBottom:'0px',opacity:0}],{duration:170,easing:'ease-in',fill:'forwards'}).finished}
  openIdx=n;JO=n;render();JO=-1}
let D=null;
function beginDrag(cw,y){closeSwipe();const cs=caseOf((dayItems(cur)[+cw.dataset.i]||{}).text||'');if(cs){const z=document.createElement('div');z.id='backZone';z.innerHTML='<i class="ti ti-arrow-back-up"></i>拖到這裡放回待排';document.body.appendChild(z)}const all=[...document.querySelectorAll('#list .cw')];const r=cw.getBoundingClientRect();
  D={card:cw,from:+cw.dataset.i,offset:y-r.top,startTop:r.top,to:+cw.dataset.i,day:null,h:r.height+8,rects:all.map(c=>{const b=c.getBoundingClientRect();return {c,h:b.height+8,mid:b.top+b.height/2}})};cw.classList.add('dragging')}
function dragMove(x,y){const bz=$('#backZone');D.back=false;if(bz){const b=bz.getBoundingClientRect();D.back=y>=b.top-10;bz.classList.toggle('hot',D.back)}const dy=y-D.offset-D.startTop;D.card.style.transform=`translateY(${dy}px)`;
  D.day=null;document.querySelectorAll('.strip .s').forEach(s=>{const b=s.getBoundingClientRect();const hit=x>=b.left&&x<=b.right&&y>=b.top-10&&y<=b.bottom+10;s.classList.toggle('drop',hit);if(hit)D.day=+s.dataset.i});
  const center=D.startTop+dy+(D.h-8)/2;
  D.to=D.day!==null?D.from:D.rects.filter((r,j)=>j!==D.from&&center>r.mid).length;
  D.rects.forEach((r,j)=>{if(j===D.from)return;let sh=0;if(D.from<D.to&&j>D.from&&j<=D.to)sh=-D.h;else if(D.from>D.to&&j>=D.to&&j<D.from)sh=D.h;r.c.style.transform=sh?`translateY(${sh}px)`:''})}
async function dragEnd(){const d=D;D=null;const bz=$('#backZone');if(bz)bz.remove();
  if(d.back){const items=clone(dayItems(cur));const it=items.splice(d.from,1)[0];const o={...cur};const cs=caseOf(it.text);d.card.style.transition='transform .2s,opacity .2s';d.card.style.opacity=0;await wait(180);
    if(cs&&!PEND.some(p=>p.id===cs.id))PEND.push(cs);save([{o,items}]);toast('已放回待排',()=>{PEND=PEND.filter(p=>p.id!==cs.id);const now=clone(dayItems(o));now.splice(Math.min(d.from,now.length),0,it);save([{o,items:now}])});return}
  document.querySelectorAll('.strip .s').forEach(s=>s.classList.remove('drop'));
  const settle=async(t,op)=>{d.card.classList.remove('dragging');d.card.style.transition='transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s';d.card.style.transform=t;if(op!=null)d.card.style.opacity=op;await wait(200)};
  if(d.day!==null){const target=weekOf(cur)[d.day];if(!same(target,cur)){haptic();await settle(d.card.style.transform+' scale(.6)',0);await loadMonth(target.y,target.m);const items=clone(dayItems(cur));const it=items.splice(d.from,1)[0];save([{o:{...cur},items},{o:target,items:clone(dayItems(target)).concat([it])}]);toast(`已移到 ${target.m}/${target.d}`);return}}
  if(d.to!==d.from){let off=0;if(d.to>d.from)for(let j=d.from+1;j<=d.to;j++)off+=d.rects[j].h;else for(let j=d.to;j<d.from;j++)off-=d.rects[j].h;
    await settle(`translateY(${off}px)`);const items=clone(dayItems(cur));const it=items.splice(d.from,1)[0];items.splice(d.to,0,it);save([{o:cur,items}]);return}
  await settle('');render()}

// ---- 換天：畫面跟著手指走（卡片上的左右滑留給完成／刪除） ----
async function slideGo(o,swipe){if(same(o,cur)||SLIDING)return;const el=$('#day');if(el.offsetParent===null){go(o);return}
  SLIDING=true;closeSwipe();const dir=new Date(o.y,o.m-1,o.d)>new Date(cur.y,cur.m-1,cur.d)?1:-1,dd=swipe?el.offsetWidth+16:44;
  el.style.transition=`transform ${swipe?.2:.14}s cubic-bezier(.4,0,1,1),opacity .14s`;el.style.transform=`translateX(${-dir*dd}px)`;if(!swipe)el.style.opacity=0;
  await wait(swipe?190:130);
  el.style.transition='none';el.style.transform=`translateX(${dir*dd}px)`;el.style.opacity=swipe?1:0;
  go(o);el.offsetWidth;
  el.style.transition='transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s';el.style.transform='';el.style.opacity=1;
  await wait(300);el.style.transition='';SLIDING=false}
(()=>{const el=$('#day'),zone=document;let sx=0,sy=0,lock=null,dx=0,t0=0,on=false;
  // 整個畫面（卡片、週列、彈出視窗以外）左右滑都能換天
  zone.addEventListener('touchstart',e=>{if(edit||D||SLIDING||el.offsetParent===null||e.target.closest('.cw,.strip,#ovl,.sheet,.fab,#toast'))return;on=true;lock=null;dx=0;t0=Date.now();sx=e.touches[0].clientX;sy=e.touches[0].clientY;el.style.transition='none'},{passive:true});
  zone.addEventListener('touchmove',e=>{if(!on)return;if(PDRAG){on=false;el.style.transform='';return}const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;if(!lock&&(Math.abs(x)>8||Math.abs(y)>8))lock=Math.abs(x)>Math.abs(y)?'h':'v';if(lock==='h'){e.preventDefault();dx=x;el.style.transform=`translateX(${x}px)`}},{passive:false});
  zone.addEventListener('touchend',()=>{if(!on)return;on=false;if(lock!=='h')return;const fast=Date.now()-t0<250;
    if(Math.abs(dx)>el.offsetWidth*0.25||(fast&&Math.abs(dx)>40))slideGo(addDays(cur,dx<0?1:-1),true);
    else{el.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';el.style.transform=''}});
  // 週列左右滑：換一整週
  const st=$('#strip');let qx=0,qy=0;
  st.addEventListener('touchstart',e=>{qx=e.touches[0].clientX;qy=e.touches[0].clientY},{passive:true});
  st.addEventListener('touchend',e=>{if(D)return;const x=e.changedTouches[0].clientX-qx,y=e.changedTouches[0].clientY-qy;if(Math.abs(x)>50&&Math.abs(x)>Math.abs(y)*1.5)slideGo(addDays(cur,x<0?7:-7))},{passive:true});
})();

async function go(o){edit=null;openIdx=-1;cur={...o};render();await Promise.all([loadMonth(o.y,o.m),...weekOf(o).filter(x=>!M[ym(x.y,x.m)]).map(x=>loadMonth(x.y,x.m))].map(p=>p.catch(()=>{})));render()}

// ---- 月曆總覽（跳到某天 / 複製到多天） ----
let PK=null;
function openPicker(mode){if(edit)syncEdit();PK={mode,y:cur.y,m:cur.m,sel:[]};drawPicker();loadMonth(PK.y,PK.m).then(drawPicker).catch(()=>{})}
function drawPicker(){if(!PK){$('#ovl').innerHTML='';return}const {y,m}=PK,first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7,mm=M[ym(y,m)];
  $('#ovl').innerHTML=`<div class="ov"><div class="h"><button id="pkPv"><i class="ti ti-chevron-left"></i></button><b>${y} 年 ${m} 月</b><button id="pkNx"><i class="ti ti-chevron-right"></i></button></div><div class="wk">${'一二三四五六日'.split('').map(w=>`<span>${w}</span>`).join('')}</div><div class="mg">${'<div></div>'.repeat(off)}${[...Array(n)].map((_,i)=>{const d=i+1,o={y,m,d},has=mm&&mm.days[d]&&mm.days[d].length;return `<div data-d="${d}" class="${PK.mode==='jump'&&same(o,cur)?'on':''} ${isToday(o)?'td':''} ${mm&&mm.holidays[d]?'hol':''} ${PK.sel.some(s=>same(s,o))?'sel':''}">${d}${has?'<span class="d"></span>':''}</div>`}).join('')}</div><div class="note">${PK.mode==='jump'?'有點點的日子代表有安排・點一天就跳過去':PK.mode==='pend'?'點一天，把這件案子排過去':'點選要複製到的日子（可以選很多天）'}</div>${PK.mode==='copy'?`<button class="btn" id="pkOk">複製到 ${PK.sel.length} 天</button>`:''}<button class="btn" id="pkCl" style="background:none;color:var(--mu)">關閉</button></div>`;
  $('#pkPv').onclick=()=>{PK.m--;if(PK.m<1){PK.m=12;PK.y--}drawPicker();loadMonth(PK.y,PK.m).then(drawPicker).catch(()=>{})};
  $('#pkNx').onclick=()=>{PK.m++;if(PK.m>12){PK.m=1;PK.y++}drawPicker();loadMonth(PK.y,PK.m).then(drawPicker).catch(()=>{})};
  $('#pkCl').onclick=()=>{PK=null;drawPicker();if(edit)render()};
  document.querySelectorAll('.mg [data-d]').forEach(c=>c.onclick=()=>{const o={y:PK.y,m:PK.m,d:+c.dataset.d};if(PK.mode==='jump'){PK=null;drawPicker();go(o)}else if(PK.mode==='pend'){const it=PK.item;PK=null;drawPicker();schedule(it,o)}else{const i=PK.sel.findIndex(s=>same(s,o));i>=0?PK.sel.splice(i,1):PK.sel.push(o);drawPicker()}});
  const ok=$('#pkOk');if(ok)ok.onclick=async()=>{if(!PK.sel.length)return;const e=edit;const src=dayItems(cur)[e.idx];const item={text:e.text.trim()||src.text,done:false,bg:e.bg,fc:src?src.fc:'',bold:src?src.bold:false,note:makeNote(e)};const keys=PK.sel.map(keyOf);PK=null;drawPicker();edit=null;$('#ovl').innerHTML='';render();try{const r=await call('append',{keys,item});absorb(r);render();toast(`已複製到 ${keys.length} 天`)}catch(err){toast('沒複製成功：'+(err.message||err))}};
}

// ---- 待排：剪輯表裡還沒排進月曆的案子 ----
async function loadPending(){try{const r=await call('pending',{});PEND=r.pending||[];OPEN=r.open||[];renderPend()}catch(e){}}
// 這件待辦是不是剪輯表裡的案子（跟後端同一套比對：編號＋｜後面的字，或專案名稱開頭）
const normT=t=>String(t).toUpperCase().replace(/[\s.．・·]/g,'');
function caseOf(text){const x=normT(text);return OPEN.find(c=>{const t=String(c.title);const codes=(t.match(/[A-Za-z]{1,5}\s?\.?\s?\d{1,4}/g)||[]).map(normT);const after=t.indexOf('｜')>=0?normT(t.split('｜').pop()).slice(0,2):'';
  if(codes.length)return codes.some(cd=>x.indexOf(cd)>=0)&&(!after||x.indexOf(after)>=0);const head=normT(t.replace(/[【】\[\]()（）]/g,'')).slice(0,6);return head.length>1&&x.indexOf(head)>=0})}
function dueSoon(d){const m=String(d||'').match(/^(\d{1,2})\/(\d{1,2})$/);if(!m)return false;const t=new Date(T.getFullYear(),+m[1]-1,+m[2]);return (t-T)/864e5<=3}
function renderPend(){const el=$('#pend');if(!el)return;$('#day').classList.toggle('hasp',PEND.length>0);if(!PEND.length){el.innerHTML='';return}
  el.innerHTML=`<button class="pend-h ${POPEN?'':'cl'}" id="pendH">待排<b>${PEND.length}</b>剪輯表裡還沒排進月曆的案子<i class="ti ti-chevron-down"></i></button>${POPEN?PEND.map((p,i)=>`<div class="pi" data-p="${i}"><div class="pt"><small>${esc(p.client)}${p.status?'・'+esc(p.status):''}</small><span>${esc(p.title)}</span></div><span class="du ${dueSoon(p.due)?'soon':''}">${p.due?'交期<br>'+esc(p.due):''}</span><i class="ti ti-grip-vertical gr"></i></div>`).join(''):''}`;
  $('#pendH').onclick=()=>{POPEN=!POPEN;try{localStorage.setItem('pendOpen',POPEN?'1':'0')}catch(e){}renderPend()};
  el.querySelectorAll('.pi').forEach(bindPend)}
function bindPend(el){const p=PEND[+el.dataset.p];let timer,sx,sy,moved=false,dragging=false,ghost=null,off=0,day=null;
  const start=(x,y)=>{sx=x;sy=y;moved=false;timer=setTimeout(()=>{dragging=true;PDRAG=true;haptic();const r=el.getBoundingClientRect();off=y-r.top;ghost=el.cloneNode(true);ghost.className='pi pghost';Object.assign(ghost.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px'});document.body.appendChild(ghost);el.style.opacity=.3},380)};
  const move=(x,y,ev)=>{if(dragging){ev.preventDefault();ghost.style.top=(y-off)+'px';day=null;document.querySelectorAll('.strip .s').forEach(s=>{const b=s.getBoundingClientRect();const hit=x>=b.left&&x<=b.right&&y>=b.top-12&&y<=b.bottom+12;s.classList.toggle('drop',hit);if(hit)day=+s.dataset.i});return}
    if(Math.abs(x-sx)>8||Math.abs(y-sy)>8){moved=true;clearTimeout(timer)}};
  const end=(x,y)=>{clearTimeout(timer);if(dragging){dragging=false;PDRAG=false;document.querySelectorAll('.strip .s').forEach(s=>s.classList.remove('drop'));ghost.remove();el.style.opacity='';
      if(day!==null)schedule(p,weekOf(cur)[day]);else{const lb=$('#list').getBoundingClientRect();if(y<lb.bottom+30)schedule(p,{...cur})}return}
    if(!moved)pendMenu(p)};
  el.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientX,t.clientY)},{passive:true});
  el.addEventListener('touchmove',e=>{const t=e.touches[0];move(t.clientX,t.clientY,e)},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];end(t.clientX,t.clientY)});
  el.addEventListener('mousedown',e=>{start(e.clientX,e.clientY);const mm=ev=>move(ev.clientX,ev.clientY,ev),mu=ev=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);end(ev.clientX,ev.clientY)};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu)})}
function pendMenu(p){$('#toast').innerHTML='';const box=document.createElement('div');box.className='sheet';
  box.innerHTML=`<div class="bx"><div class="tt">${esc(p.client)}${p.due?'・交期 '+esc(p.due):''}<b>${esc(p.title)}</b></div><button data-a="here"><i class="ti ti-calendar-plus"></i>排到 ${cur.m}/${cur.d}</button><button data-a="pick"><i class="ti ti-calendar-month"></i>選其他日期…</button><button data-a="skip"><i class="ti ti-eye-off"></i>不用排（不再顯示）</button><button class="cx" data-a="cx">取消</button></div>`;
  document.body.appendChild(box);const close=()=>box.remove();
  box.onclick=e=>{if(e.target===box)close()};
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;close();
    if(a==='here')schedule(p,{...cur});
    else if(a==='pick'){openPicker('pend');PK.item=p;drawPicker()}
    else if(a==='skip'){PEND=PEND.filter(x=>x.id!==p.id);renderPend();toast('之後不會再出現');try{await call('pendSkip',{id:p.id})}catch(e){}}})}
async function schedule(p,o){PEND=PEND.filter(x=>x.id!==p.id);renderPend();await loadMonth(o.y,o.m);
  const items=clone(dayItems(o)).concat([{text:p.text,done:false,bg:'',fc:'',bold:false,note:p.due&&/\d/.test(p.due)?'備註：交期 '+p.due:''}]);
  await save([{o,items}]);toast(`已排到 ${o.m}/${o.d}`)}

// ---- 收入（讀剪輯表的結算分頁） ----
async function openIncome(){$('#ovl').innerHTML=`<div class="ov in"><div class="h"><b>收入</b><button id="icCl"><i class="ti ti-x"></i></button></div><div id="icB"><div class="empty">讀取中…</div></div></div>`;
  $('#icCl').onclick=()=>{$('#ovl').innerHTML=''};
  try{const r=await call('income',{});if(!$('#icB'))return;const mx=Math.max(1,...r.months.map(x=>x.all)),nm=T.getMonth()+1;
    $('#icB').innerHTML=`<div class="inc">${r.top.map((t,i)=>`<div class="${i===0?'hi':''}">${esc(t.label)}<b>${esc(t.value)}</b></div>`).join('')}</div>
    <div class="mh"><b>每月做了多少</b><span>深色＝已完成　淺色＝已排還沒做完</span></div>
    <div class="mb">${r.months.filter(x=>x.all>0||x.m<=nm).map(x=>`<div class="mr ${x.m===nm?'now':''}"><span class="m">${x.m} 月</span><div class="tk"><i style="width:${x.all/mx*100}%;background:#EDE3F1"></i><i style="width:${x.done/mx*100}%;background:#C5AECF"></i></div><span class="v"><b>NT$${x.done.toLocaleString()}</b>${x.all>x.done?`（已排 ${x.all.toLocaleString()}）`:''}</span></div>`).join('')}</div>`;
  const ov=$('#ovl .ov');if(ov)ov.scrollTop=0}
  catch(e){if($('#icB'))$('#icB').innerHTML='<div class="empty">讀取失敗：'+esc(e.message||e)+'</div>'}}

// ---- 搜尋 ----
function openSearch(){$('#ovl').innerHTML=`<div class="ov"><div class="h"><b>搜尋</b><button id="srCl"><i class="ti ti-x"></i></button></div><div class="sr"><i class="ti ti-search"></i><input id="srIn"></div><div id="srRes"></div></div>`;
  $('#srCl').onclick=()=>{$('#ovl').innerHTML=''};const inp=$('#srIn');inp.focus();let t;
  inp.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const q=inp.value.trim();if(!q){$('#srRes').innerHTML='';return}$('#srRes').innerHTML='<div class="empty">搜尋中…</div>';try{const r=await call('search',{q});if(inp.value.trim()!==q)return;$('#srRes').innerHTML=r.results.length?r.results.map((x,i)=>`<div class="res ${x.done?'x':''}" data-i="${i}"><span class="dt">${x.y!==T.getFullYear()?x.y+'/':''}${x.m}/${x.d}</span><span class="t">${esc(x.text)}</span></div>`).join(''):'<div class="empty">找不到</div>';document.querySelectorAll('.res').forEach(el=>el.onclick=()=>{const x=r.results[+el.dataset.i];$('#ovl').innerHTML='';go({y:x.y,m:x.m,d:x.d})})}catch(e){$('#srRes').innerHTML='<div class="empty">搜尋失敗</div>'}},350)}}

function toast(msg,undo){clearTimeout(undoTimer);$('#toast').innerHTML=`<div class="toast"><span>${esc(msg)}</span>${undo?'<button id="tUndo">復原</button>':''}</div>`;const u=$('#tUndo');if(u)u.onclick=()=>{$('#toast').innerHTML='';undo()};undoTimer=setTimeout(()=>$('#toast').innerHTML='',undo?6000:2500)}

$('#fab').onclick=()=>openEdit(-1);
$('#moBtn').onclick=()=>openPicker('jump');
$('#srBtn').onclick=openSearch;
$('#inBtn').onclick=openIncome;
$('#tdBtn').onclick=()=>slideGo({y:T.getFullYear(),m:T.getMonth()+1,d:T.getDate()});
window.addEventListener('resize',render);
go(cur).then(loadPending);
// 自動更新：回到 App 時檢查網站上有沒有新版，有就重新載入
const VER=/*VER*/'20261013011302';
async function checkVer(){if(VER==='dev')return;try{const t=await (await fetch('./?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/\/\*VER\*\/'(\w+)'/);if(m&&m[1]!==VER&&!edit)location.reload()}catch(e){}}
checkVer();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadPending();checkVer()}});
</script>
